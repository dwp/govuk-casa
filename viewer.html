<script>
const B={"meta":{"title":"GOV.UK CASA OKF Wiki","default_corpus":"casa","generated_by":"scripts/update_viewer.py","repository_url":"https://github.com/dwp/govuk-casa","repository_branch":"main","corpus_order":["casa"]},"corpora":{"casa":{"id":"casa","label":"CASA OKF","title":"GOV.UK CASA OKF Wiki","subtitle":"Open Knowledge Format viewer for @dwp/govuk-casa concepts, examples, playbooks, and references","root":"index.md","source_root":"wiki","markdown_url":"wiki/index.md","sections":["root","concepts","examples","playbooks","references"],"nodes":{"concepts/casa-framework.md":{"id":"concepts/casa-framework.md","type":"Framework","title":"CASA Framework","description":"A Node.js/ExpressJS framework for building multi-page GOV.UK Design System forms.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[overview, casa, govuk, express, forms]","route_aliases":["concepts-casa-framework"],"exchange_id":"","source_id":"","section":"concepts","source":"wiki/concepts/casa-framework.md","body":"CASA (`@dwp/govuk-casa`) is a framework, maintained by the DWP Engineering\nPractice, for building **Collect-And-Submit Applications** — the multi-page,\none-question-per-page web forms common across UK government services. It adopts\nthe [GOV.UK Design System](/references/govuk-design-system.md) for accessible,\nwell-researched markup and runs as a set of [ExpressJS](/references/express.md)\nrouters and middleware.\n\n# What CASA gives you\n\nCASA handles the cross-cutting concerns of a government form service so a team\ncan focus on questions and content:\n\n* **Journey routing** — model every possible path through a service as a\n  directed graph (the [Plan](/concepts/plan.md)), with conditional branching driven by\n  the user's answers.\n* **State management** — capture answers and validation state per user in the\n  [Journey Context](/concepts/journey-context.md), persisted in the server session.\n* **Form pages** — bind a [Page](/concepts/page.md) to each [Waypoint](/concepts/waypoint.md),\n  render it with [Nunjucks templates](/concepts/templating.md), and collect\n  [Fields](/concepts/field.md) validated by built-in or custom [Validators](/concepts/validation.md).\n* **Multi-language** — first-class [internationalisation](/concepts/i18n.md) via i18next.\n* **Extensibility** — a small core extended through [Hooks](/concepts/hooks.md),\n  [Events](/concepts/events.md), and [Plugins](/concepts/plugins.md).\n\n# How the pieces fit together\n\n1. You call [`configure()`](/concepts/configure.md) with your Plan, pages,\n   session settings, and any hooks/events/plugins.\n2. `configure()` returns mutable [routers and middleware](/concepts/routers-and-middleware.md)\n   plus a [`mount()`](/concepts/mount.md) function.\n3. You optionally tweak those artifacts, then call `mount()` to seal everything\n   onto an ExpressJS app.\n4. At request time, CASA passes each request through an ordered\n   [request lifecycle](/concepts/request-lifecycle.md), steering the user\n   through the Plan and rendering the appropriate page.\n\n# Key facts\n\n| Property        | Value                                             |\n| --------------- | ------------------------------------------------- |\n| Package         | `@dwp/govuk-casa`                                 |\n| Version         | 9.4.4                                             |\n| Runtime         | Node.js `>=18 <=22`, ExpressJS 4                  |\n| Module formats  | ESM and CommonJS                                  |\n| Templating      | Nunjucks (+ `govuk-frontend` macros)              |\n| Licence         | ISC                                               |\n| Maintainer      | DWP Engineering Practice                          |\n\n# Getting started\n\nSee the [setup playbook](/playbooks/setting-up-a-casa-app.md) and the\n[barebones example](/examples/barebones.md) for a minimal working application.\n\n# Citations\n\n[1] [CASA README](https://github.com/dwp/govuk-casa/blob/main/README.md)\n[2] [CASA documentation index](https://github.com/dwp/govuk-casa/blob/main/docs/index.md)"},"concepts/configure.md":{"id":"concepts/configure.md","type":"API Entrypoint","title":"configure()","description":"The single entrypoint that builds all CASA routers, middleware, and the mount function.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[api, setup, configuration]","route_aliases":["concepts-configure"],"exchange_id":"","source_id":"","section":"concepts","source":"wiki/concepts/configure.md","body":"`configure()` is the entrypoint for setting up a CASA app. It has **no\nside-effects** on the wider application, so it can safely configure multiple\nCASA sub-apps in the same process. It returns the routers, middleware, and a\n[`mount()`](/concepts/mount.md) function.\n\n```javascript\nimport { configure } from \"@dwp/govuk-casa\";\n\nconst { mount } = configure({ /* options */ });\n\nconst casaApp = express();\nmount(casaApp);\n\nconst app = express();\napp.use(\"/some-mount-url\", casaApp);\napp.listen();\n```\n\n# Options\n\n| Option                  | Type                | Notes                                                                 |\n| ----------------------- | ------------------- | --------------------------------------------------------------------- |\n| `views` *(required)*    | `string[]`          | Nunjucks view directories. See [Templating](/concepts/templating.md). |\n| `session.name` *(req.)* | `string`            | Session cookie name.                                                   |\n| `session.secret` *(req.)* | `string`          | Secret used to sign cookies.                                          |\n| `session.ttl`           | `number`            | Session expiry, in seconds.                                           |\n| `session.secure`        | `boolean`           | Flag the session cookie secure (requires TLS).                        |\n| `session.store`         | `object`            | An `express-session` store (defaults to `MemoryStore`).               |\n| `session.cookieSameSite`| `string\\|boolean`   | `Strict` (default), `Lax`, or `None`.                                 |\n| `mountUrl`              | `string`            | URL prefix; setting it enters proxy mode.                             |\n| `i18n.dirs`             | `string[]`          | Translation search directories. See [i18n](/concepts/i18n.md).        |\n| `i18n.locales`          | `string[]`          | Supported locales.                                                    |\n| `plan`                  | `Plan`              | The [Plan](/concepts/plan.md).                                        |\n| `pages`                 | `object[]`          | [Page](/concepts/page.md) definitions.                                |\n| `hooks`                 | `object[]`          | Global [Hooks](/concepts/hooks.md).                                   |\n| `events`                | `object[]`          | Journey Context [Events](/concepts/events.md).                        |\n| `plugins`               | `object[]`          | [Plugins](/concepts/plugins.md).                                      |\n| `errorVisibility`       | `Symbol\\|Function`  | Keep validation errors visible on GET.                                |\n| `helmetConfigurator`    | `function`          | Modify CASA's default Helmet config.                                  |\n| `formMaxParams`         | `integer`           | Max form parameters to ingest (default `25`).                         |\n| `formMaxBytes`          | `integer\\|string`   | Max form payload (default `50kb`).                                    |\n| `contextIdGenerator`    | `function`          | Custom ephemeral context ID generator (default UUID).                 |\n\n# What it returns\n\nA call to `configure()` returns mutable routers, mutable middleware arrays, and\nthe `mount()` function. Everything can be modified **before** `mount()` is\ncalled and is effectively sealed thereafter. See\n[Routers & middleware](/concepts/routers-and-middleware.md) for the full list\nand the order in which they are mounted.\n\n# Citations\n\n[1] [Setting up a CASA application](https://github.com/dwp/govuk-casa/blob/main/docs/setup.md)\n[2] [configure.js](https://github.com/dwp/govuk-casa/blob/main/src/lib/configure.js)"},"concepts/edit-mode.md":{"id":"concepts/edit-mode.md","type":"Feature","title":"Edit mode","description":"A workflow for revisiting answers and returning users to an origin page after changes.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[journey, editing, plugins]","route_aliases":["concepts-edit-mode"],"exchange_id":"","source_id":"","section":"concepts","source":"wiki/concepts/edit-mode.md","body":"Edit mode lets a user revisit an earlier waypoint, change an answer, and return\nto the page they came from. CASA tracks edit state through request data and\ntemplate variables such as `inEditMode`, `editOriginUrl`, and `editCancelUrl`.\n\n# Snapshot plugin\n\nThe core `editSnapshot` plugin changes cancel behaviour. If a user cancels or\nnavigates away from the edit workflow, CASA restores the Journey Context to the\nstate it had before editing began.\n\n# Relationships\n\nEdit mode depends on [Journey Context](/concepts/journey-context.md) snapshots,\n[Plan](/concepts/plan.md) traversal, and page rendering in the\n[request lifecycle](/concepts/request-lifecycle.md).\n\n# Citations\n\n[1] [Edit mode guide](https://github.com/dwp/govuk-casa/blob/main/docs/guides/edit-mode.md)\n[2] [Edit snapshots plugin](https://github.com/dwp/govuk-casa/blob/main/src/core-plugins/edit-snapshot/readme.md)"},"concepts/events.md":{"id":"concepts/events.md","type":"Extension Point","title":"Events","description":"Synchronous handlers that react when Journey Context data changes.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[extension, state, journey-context]","route_aliases":["concepts-events"],"exchange_id":"","source_id":"","section":"concepts","source":"wiki/concepts/events.md","body":"Events let an application react to changes in [Journey Context](/concepts/journey-context.md)\ndata. They are configured as part of `configure({ events: [...] })`.\n\n# Shape\n\nAn event watches a waypoint and optionally a specific field. Its handler\nreceives the current Journey Context, the previous context, the session, and\nuser-space metadata.\n\n# Use cases\n\n* Derive downstream data after an answer changes.\n* Clear stale data when a branching answer invalidates later pages.\n* Trigger session-local side effects that must happen in step with context\n  updates.\n\n# Boundaries\n\nEvents run synchronously in the request path. Long-running work should be\ndeferred outside the request lifecycle. Event handlers should preserve the\nshape and safety constraints of the Journey Context.\n\n# Citations\n\n[1] [Events documentation](https://github.com/dwp/govuk-casa/blob/main/docs/events.md)\n[2] [JourneyContext.js](https://github.com/dwp/govuk-casa/blob/main/src/lib/JourneyContext.js)"},"concepts/field.md":{"id":"concepts/field.md","type":"Domain Model","title":"Field","description":"A declared form input, including processors, validators, conditions, and persistence metadata.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[forms, validation, sanitisation]","route_aliases":["concepts-field"],"exchange_id":"","source_id":"","section":"concepts","source":"wiki/concepts/field.md","body":"A field describes one submitted input on a [Page](/concepts/page.md). Fields\nare created with the `field()` factory and attached to page definitions.\n\n# Capabilities\n\n* Simple field names such as `name`.\n* One-level complex names such as `address[postcode]`.\n* Optional fields via `{ optional: true }`.\n* Non-persisted transient fields via `{ persist: false }`.\n* Processors that transform values before storage.\n* Validators that return `ValidationError` values.\n* Conditions that decide whether processors and validators should run.\n\n# Sanitisation flow\n\nDuring POST handling, CASA first prunes unknown fields from `req.body`, then\ntests field conditions, applies processors, and writes the sanitised data back\nto the request. This guards the [Journey Context](/concepts/journey-context.md)\nagainst unexpected form fields.\n\n# Relationships\n\nFields feed the [Validation](/concepts/validation.md) system and write values\ninto [Journey Context](/concepts/journey-context.md) under their page waypoint.\n\n# Citations\n\n[1] [Fields and validation](https://github.com/dwp/govuk-casa/blob/main/docs/fields.md)\n[2] [field.js](https://github.com/dwp/govuk-casa/blob/main/src/lib/field.js)"},"concepts/hooks.md":{"id":"concepts/hooks.md","type":"Extension Point","title":"Hooks","description":"Named middleware insertion points in CASA's static, ancillary, and journey routers.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[extension, middleware, lifecycle]","route_aliases":["concepts-hooks"],"exchange_id":"","source_id":"","section":"concepts","source":"wiki/concepts/hooks.md","body":"Hooks let applications insert Express middleware at named points in CASA's\nrouters. They are configured at boot time and run as part of the normal\n[request lifecycle](/concepts/request-lifecycle.md).\n\n# Scope\n\nHooks are named as `<scope>.<hook>`.\n\n| Scope       | Meaning |\n| ----------- | ------- |\n| `static`    | Static asset router. |\n| `ancillary` | Ancillary routes such as session-timeout. |\n| `journey`   | Waypoint GET/POST routes. |\n\n# Journey hooks\n\n| Hook | Meaning |\n| ---- | ------- |\n| `journey.presteer` / `journey.poststeer` | Around traversal checks that prevent jumping ahead. |\n| `journey.presanitise` / `journey.postsanitise` | Around request body pruning and field processing. |\n| `journey.pregather` / `journey.postgather` | Around writing submitted data into Journey Context. |\n| `journey.prevalidate` / `journey.postvalidate` | Around field validation. |\n| `journey.preredirect` | Before redirecting to the next waypoint. |\n| `journey.prerender` | Before rendering a waypoint page. |\n\n# Page-specific hooks\n\nPage definitions may include hooks without the `journey.` prefix. CASA prefixes\nthem and runs page hooks after global hooks.\n\n# Citations\n\n[1] [Hooks documentation](https://github.com/dwp/govuk-casa/blob/main/docs/hooks.md)"},"concepts/i18n.md":{"id":"concepts/i18n.md","type":"Internationalisation System","title":"Internationalisation","description":"Multi-language dictionary loading and request/template translation via i18next.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[i18n, localisation, templates]","route_aliases":["concepts-i18n"],"exchange_id":"","source_id":"","section":"concepts","source":"wiki/concepts/i18n.md","body":"CASA uses i18next for translations. Each request receives `req.t()` and each\ntemplate receives `t()`.\n\n# Dictionary shape\n\nDictionary directories are organised by locale. Files under each locale become\ni18next namespaces.\n\n```text\nlocales/\n  en/\n    common.json\n    page.yaml\n  cy/\n    common.json\n    page.yaml\n```\n\n# Configuration\n\n`configure({ i18n: { dirs, locales } })` controls dictionary directories and\nsupported locales. CASA loads its bundled locales first, then user-supplied\ndirectories so application dictionaries can override default strings.\n\n# Relationships\n\nInternationalisation is wired during [`configure()`](/concepts/configure.md)\nand exposed during the [request lifecycle](/concepts/request-lifecycle.md).\nIt supports [Templating](/concepts/templating.md), validation messages, and\nerror pages.\n\n# Citations\n\n[1] [Internationalisation documentation](https://github.com/dwp/govuk-casa/blob/main/docs/i18n.md)"},"concepts/index.md":{"id":"concepts/index.md","type":"Index","title":"Core concepts","description":"CASA Framework - Top-level overview of what CASA is and how its pieces fit together.","timestamp":"","aliases":"","tags":"","route_aliases":["concepts-index"],"exchange_id":"","source_id":"","section":"concepts","source":"wiki/concepts/index.md","body":"# Core concepts\n\n* [CASA Framework](casa-framework.md) - Top-level overview of what CASA is and how its pieces fit together.\n* [configure()](configure.md) - The single entrypoint that wires up all routers, middleware, and the mount function.\n* [mount()](mount.md) - Seals configuration and mounts CASA onto an ExpressJS app.\n\n# The journey model\n\n* [The Plan](plan.md) - Directed-graph blueprint of every journey a user can take.\n* [Waypoint](waypoint.md) - A visitable node in the Plan graph.\n* [Route](route.md) - A conditional edge connecting two waypoints.\n* [Journey Context](journey-context.md) - The per-user state (data + validation) of a journey.\n\n# Pages, fields & validation\n\n* [Page](page.md) - The concrete, interactive form that renders a waypoint.\n* [Field](field.md) - A single form input, its processors and validators.\n* [Validation](validation.md) - The validator system and the ten built-in rules.\n\n# Extension points\n\n* [Hooks](hooks.md) - Insert middleware at named points in the request lifecycle.\n* [Events](events.md) - React synchronously to Journey Context changes.\n* [Plugins](plugins.md) - Bundle config/bootstrap/template changes into reusable units.\n* [Edit mode](edit-mode.md) - Let users revisit and amend earlier answers.\n\n# Request flow & rendering\n\n* [Request lifecycle](request-lifecycle.md) - Ordered passage of a request through CASA's stages.\n* [Routers & middleware](routers-and-middleware.md) - The artifacts `configure()` returns and their mount order.\n* [Templating](templating.md) - Nunjucks layouts, blocks, macros, and error pages.\n* [Internationalisation](i18n.md) - Multi-language dictionaries via i18next."},"concepts/journey-context.md":{"id":"concepts/journey-context.md","type":"State Model","title":"Journey Context","description":"The canonical per-user data, validation, navigation, and identity state for a journey.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[state, session, data, validation]","route_aliases":["concepts-journey-context"],"exchange_id":"","source_id":"","section":"concepts","source":"wiki/concepts/journey-context.md","body":"`JourneyContext` represents a user's current state as they move through a\n[Plan](/concepts/plan.md). It is the canonical model for captured answers and\nvalidation status.\n\n# Stored state\n\n| Area         | Purpose |\n| ------------ | ------- |\n| `data`       | Form answers keyed by waypoint. |\n| `validation` | Validation state and errors keyed by waypoint. |\n| `nav`        | Navigation context such as language and skip state. |\n| `identity`   | Context identity for multi-context and sub-app flows. |\n\n# Important behaviours\n\n* Converts to and from plain objects for session persistence.\n* Rehydrates serialized validation errors as `ValidationError` instances.\n* Validates object keys to prevent prototype-sensitive names such as\n  `__proto__`, `prototype`, and `constructor`.\n* Can create context snapshots used by edit-mode and stale-data handling.\n* Emits configured [Events](/concepts/events.md) when context data changes.\n\n# Relationships\n\n[Fields](/concepts/field.md) write values into the Journey Context. The\n[Validation](/concepts/validation.md) layer writes validation results into it.\nRoute conditions in the [Plan](/concepts/plan.md) read it to decide where a\nuser should go next.\n\n# Citations\n\n[1] [Journey Context documentation](https://github.com/dwp/govuk-casa/blob/main/docs/journey-context.md)\n[2] [JourneyContext.js](https://github.com/dwp/govuk-casa/blob/main/src/lib/JourneyContext.js)"},"concepts/mount.md":{"id":"concepts/mount.md","type":"API Entrypoint","title":"mount()","description":"The function that seals CASA routers and middleware onto an Express application.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[api, express, mounting, runtime]","route_aliases":["concepts-mount"],"exchange_id":"","source_id":"","section":"concepts","source":"wiki/concepts/mount.md","body":"`mount()` is returned by [`configure()`](/concepts/configure.md). It attaches\nCASA's configured routers and middleware to an ExpressJS app in the correct\norder and seals the mutable routers so later edits cannot silently change the\nruntime surface.\n\n# Responsibilities\n\n* Attach the configured Nunjucks environment to the supplied app.\n* Optionally strip a configured proxy `mountUrl` prefix from incoming requests.\n* Optionally serve the first [Plan](/concepts/plan.md) waypoint when `/` is\n  visited.\n* Capture `req.unparameterisedBaseUrl` before parameterised routes affect\n  `req.baseUrl`.\n* Mount static assets outside the parameterised journey router so assets are\n  served from stable URLs.\n* Mount session, i18n, body parsing, data, ancillary, journey, and post\n  middleware in the documented order.\n\n# Options\n\n| Option               | Default | Purpose |\n| -------------------- | ------- | ------- |\n| `route`              | `/`     | Express route under which the CASA app is mounted. |\n| `serveFirstWaypoint` | `false` | Redirect `/` to the first reachable waypoint in the Plan. |\n\n# Relationships\n\n`mount()` consumes the artifacts from [`configure()`](/concepts/configure.md)\nand creates the concrete [request lifecycle](/concepts/request-lifecycle.md).\nAny [Plugin](/concepts/plugins.md) that needs to alter routers or middleware\nmust do so before `mount()` seals them.\n\n# Citations\n\n[1] [The mount() function](https://github.com/dwp/govuk-casa/blob/main/docs/mount-function.md)\n[2] [mount.js](https://github.com/dwp/govuk-casa/blob/main/src/lib/mount.js)"},"concepts/page.md":{"id":"concepts/page.md","type":"Domain Model","title":"Page","description":"A concrete form page that implements a waypoint using a view, fields, hooks, and validation settings.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[forms, pages, templates, routing]","route_aliases":["concepts-page"],"exchange_id":"","source_id":"","section":"concepts","source":"wiki/concepts/page.md","body":"A page is the interactive implementation of a [Waypoint](/concepts/waypoint.md).\nIt is configured in `configure({ pages: [...] })` and mounted by the journey\nrouter.\n\n# Structure\n\n| Property          | Purpose |\n| ----------------- | ------- |\n| `waypoint`        | Waypoint identifier and route path. |\n| `view`            | Nunjucks template used to render the page. |\n| `fields`          | [Fields](/concepts/field.md) gathered and validated for this waypoint. |\n| `hooks`           | Page-specific [Hooks](/concepts/hooks.md). |\n| `errorVisibility` | Page override for validation error visibility on GET. |\n\n# Runtime behaviour\n\nFor each page, CASA mounts matching GET and POST routes. GET requests steer the\njourney and render the page. POST requests steer, sanitise, gather, validate,\npossibly redirect, and then render on validation failure.\n\n# Template contract\n\nThe journey router supplies template data including:\n\n* `formUrl`\n* `formData`\n* `formErrors`\n* `formErrorsGovukArray`\n* `inEditMode`\n* `editOriginUrl`\n* `activeContextId`\n\n# Citations\n\n[1] [Pages documentation](https://github.com/dwp/govuk-casa/blob/main/docs/pages.md)\n[2] [journey route builder](https://github.com/dwp/govuk-casa/blob/main/src/routes/journey.js)"},"concepts/plan.md":{"id":"concepts/plan.md","type":"Domain Model","title":"The Plan","description":"The directed graph that describes every possible route through a CASA journey.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[journey, graph, routing, public-api]","route_aliases":["concepts-plan"],"exchange_id":"","source_id":"","section":"concepts","source":"wiki/concepts/plan.md","body":"A `Plan` is the blueprint for a CASA journey. It stores [Waypoints](/concepts/waypoint.md)\nas graph nodes and [Routes](/concepts/route.md) as directed graph edges. The\nimplementation uses `@dagrejs/graphlib` and supports named routes such as\n`next` and `prev`.\n\n# Core behaviours\n\n* `addSequence()` creates a linear chain of two-way routes.\n* `setRoute()` creates paired `next` and `prev` routes between two waypoints.\n* `setNextRoute()` and `setPrevRoute()` create one-way route edges.\n* `addSkippables()` marks waypoints that may be skipped using `skipto`.\n* `traverseNextRoutes()` and `traversePrevRoutes()` walk the graph using the\n  current [Journey Context](/concepts/journey-context.md).\n* `getGraphStructure()` exposes the underlying graph for diagnostics or\n  visualisation.\n\n# Route decision model\n\nBy default, a route is followable only when the source waypoint has passed\nvalidation. Custom route conditions can refine that decision using the current\nJourney Context. A Plan can also configure traversal arbitration when multiple\nroutes are simultaneously satisfiable.\n\n# Exit nodes\n\nWaypoints that begin with a URL-like protocol such as `url://` are treated as\nexit nodes. They let a Plan hand off to a sub-application or another route\noutside the current Plan.\n\n# Citations\n\n[1] [Plan documentation](https://github.com/dwp/govuk-casa/blob/main/docs/plan.md)\n[2] [Plan.js](https://github.com/dwp/govuk-casa/blob/main/src/lib/Plan.js)"},"concepts/plugins.md":{"id":"concepts/plugins.md","type":"Extension Point","title":"Plugins","description":"Reusable extension packages with configure and bootstrap phases.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[extension, plugins, templates, middleware]","route_aliases":["concepts-plugins"],"exchange_id":"","source_id":"","section":"concepts","source":"wiki/concepts/plugins.md","body":"Plugins package reusable CASA changes. They can modify raw configuration before\nCASA builds runtime artifacts, then modify the resulting routers, middleware,\nor Nunjucks environment before [`mount()`](/concepts/mount.md) seals them.\n\n# Phases\n\n| Phase       | Timing | Typical work |\n| ----------- | ------ | ------------ |\n| `configure` | Before config ingestion | Add pages, views, hooks, events, or defaults to the raw config object. |\n| `bootstrap` | After CASA builds artifacts | Add routes, modify templates, adjust routers, or use the Nunjucks environment. |\n\n# Template modification\n\nCASA exposes a specialised Nunjucks loader so plugins can insert content into\nnamed template blocks. Plugins should normally provide an opt-out and a manual\ninsertion path for services that need precise template control.\n\n# Core plugin\n\nThe repository currently exports the [Edit mode](/concepts/edit-mode.md)\nsnapshot plugin through `corePlugins.editSnapshot()`.\n\n# Citations\n\n[1] [Plugins documentation](https://github.com/dwp/govuk-casa/blob/main/docs/plugins.md)\n[2] [core plugin index](https://github.com/dwp/govuk-casa/blob/main/src/core-plugins/index.js)"},"concepts/request-lifecycle.md":{"id":"concepts/request-lifecycle.md","type":"Runtime Flow","title":"Request lifecycle","description":"The ordered path a request takes through CASA routers and middleware.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[runtime, middleware, lifecycle]","route_aliases":["concepts-request-lifecycle"],"exchange_id":"","source_id":"","section":"concepts","source":"wiki/concepts/request-lifecycle.md","body":"The request lifecycle is the runtime ordering established by\n[`mount()`](/concepts/mount.md). CASA adds data to `req`, `req.casa`, and\n`res.locals` as requests pass through the stack.\n\n# High-level order\n\n1. Pre middleware sets no-cache headers, generates a CSP nonce, and applies\n   Helmet security headers.\n2. Static router serves bundled GOV.UK and CASA assets.\n3. Session middleware initializes or loads session state.\n4. Cookie parser parses signed cookies.\n5. Session expiry logic may redirect to `session-timeout`.\n6. i18n middleware detects language and exposes `t()`.\n7. Body parser verifies and parses form bodies.\n8. Data middleware attaches Plan, Journey Context, edit state, and template\n   helpers.\n9. Ancillary router mounts generic routes such as `session-timeout`.\n10. Journey router handles waypoint GET/POST requests.\n11. Post middleware handles 404 and error responses.\n\n# POST journey flow\n\nFor waypoint POSTs, CASA steers the journey, sanitises submitted fields, gathers\ndata, validates fields, redirects on success, and renders the page again on\nvalidation failure.\n\n# Template locals\n\nThe lifecycle exposes locals such as `cspNonce`, `casa.csrfToken`,\n`casa.waypoint`, `casa.mountUrl`, `casa.locale`, `htmlLang`, and\n`waypointUrl()`.\n\n# Citations\n\n[1] [Request lifecycle documentation](https://github.com/dwp/govuk-casa/blob/main/docs/request-lifecycle.md)"},"concepts/route.md":{"id":"concepts/route.md","type":"Domain Concept","title":"Route","description":"A directed, optionally conditional edge between two CASA waypoints.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[journey, graph, routing]","route_aliases":["concepts-route"],"exchange_id":"","source_id":"","section":"concepts","source":"wiki/concepts/route.md","body":"A route is a named edge in a [Plan](/concepts/plan.md). CASA uses `next` routes\nfor forward traversal and `prev` routes for backwards traversal.\n\n# Follow conditions\n\nEach route has a follow function. If no custom function is supplied, CASA uses\nthe default rule:\n\n* `next`: the source waypoint must have validation state `null`.\n* `prev`: the target waypoint must have validation state `null`.\n\nCustom follow functions receive the route object and the current\n[Journey Context](/concepts/journey-context.md). They should return a boolean.\nWhen `validateBeforeRouteCondition` is enabled, CASA applies its validation\ngate before evaluating the custom condition.\n\n# Arbitration\n\nIf more than one route from a waypoint is followable, the Plan uses its\nconfigured arbiter. `arbiter: \"auto\"` chooses a route by forward traversal; a\ncustom function can choose explicitly.\n\n# Labels\n\nRoute labels include the custom condition function name when one is available.\nThis makes generated graph visualisations easier to understand.\n\n# Citations\n\n[1] [Route conditions](https://github.com/dwp/govuk-casa/blob/main/docs/plan.md)\n[2] [Plan.setNamedRoute](https://github.com/dwp/govuk-casa/blob/main/src/lib/Plan.js)"},"concepts/routers-and-middleware.md":{"id":"concepts/routers-and-middleware.md","type":"Runtime Component","title":"Routers and middleware","description":"The Express routers and middleware arrays produced by configure() and mounted by mount().","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[runtime, express, middleware]","route_aliases":["concepts-routers-and-middleware"],"exchange_id":"","source_id":"","section":"concepts","source":"wiki/concepts/routers-and-middleware.md","body":"[`configure()`](/concepts/configure.md) returns the concrete artifacts that make\nup a CASA app. These can be inspected or modified before [`mount()`](/concepts/mount.md)\nseals them.\n\n# Returned artifacts\n\n| Artifact | Purpose |\n| -------- | ------- |\n| `nunjucksEnv` | Rendering environment attached to Express. |\n| `preMiddleware` | Request method gate, cache-control headers, CSP nonce, Helmet. |\n| `postMiddleware` | 404 and error handling. |\n| `staticRouter` | Static asset routes for GOV.UK and CASA assets. |\n| `ancillaryRouter` | Generic routes such as session-timeout. |\n| `journeyRouter` | Waypoint GET/POST routes. |\n| `csrfMiddleware` | CSRF protection and token exposure. |\n| `cookieParserMiddleware` | Signed cookie parsing. |\n| `sessionMiddleware` | `express-session` setup and expiry handling. |\n| `bodyParserMiddleware` | URL-encoded body parsing with prototype-key verification. |\n| `i18nMiddleware` | i18next request/template translation support. |\n| `dataMiddleware` | Journey data, Plan, mount URL, edit state, and helpers. |\n| `mount` | Function that attaches the stack to an Express app. |\n\n# Safety defaults\n\nThe middleware stack includes no-store cache headers, Helmet CSP configuration,\nCSRF protection, form size/parameter limits, and body verification for\nprototype-sensitive key names.\n\n# Citations\n\n[1] [configure.js](https://github.com/dwp/govuk-casa/blob/main/src/lib/configure.js)\n[2] [pre middleware](https://github.com/dwp/govuk-casa/blob/main/src/middleware/pre.js)\n[3] [body parser middleware](https://github.com/dwp/govuk-casa/blob/main/src/middleware/body-parser.js)"},"concepts/templating.md":{"id":"concepts/templating.md","type":"Rendering System","title":"Templating","description":"CASA's Nunjucks template lookup, layouts, macros, and template helpers.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[templates, nunjucks, govuk-frontend, rendering]","route_aliases":["concepts-templating"],"exchange_id":"","source_id":"","section":"concepts","source":"wiki/concepts/templating.md","body":"CASA renders pages with [Nunjucks](/references/nunjucks.md). Template lookup\nprioritises user-supplied views, then CASA internal templates, then\n[`govuk-frontend`](/references/govuk-frontend.md).\n\n# Layouts\n\n| Layout | Purpose |\n| ------ | ------- |\n| `casa/layouts/main.njk` | General-purpose CASA pages. |\n| `casa/layouts/journey.njk` | Waypoint form pages in a Plan. |\n| `govuk/template.njk` | Lower-level GOV.UK Frontend template. |\n\n# Form components\n\nCASA wraps GOV.UK component macros under `views/casa/components/*`. These\nwrappers preserve the GOV.UK macro interfaces and add CASA-specific helpers for\nerrors, values, and analytics attributes.\n\n# Template helpers\n\nTemplates receive helpers including `mergeObjects()`, `includes()`,\n`formatDateObject()`, `renderAsAttributes()`, and `waypointUrl()`.\n\n# Error pages\n\nDefault templates cover 403, 404, 500, 503, and static fallback errors. Services\ncan override them by providing matching paths in their own view directory.\n\n# Citations\n\n[1] [Templating documentation](https://github.com/dwp/govuk-casa/blob/main/docs/templating.md)"},"concepts/validation.md":{"id":"concepts/validation.md","type":"Validation System","title":"Validation","description":"CASA's field validation model and built-in validator catalog.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[forms, validation, public-api]","route_aliases":["concepts-validation"],"exchange_id":"","source_id":"","section":"concepts","source":"wiki/concepts/validation.md","body":"Validation runs during POST handling after fields have been sanitised and\ngathered into the [Journey Context](/concepts/journey-context.md). CASA runs\nevery validator for every declared field so the user sees a complete error list\nfor the current page.\n\n# Built-in validators\n\n| Validator             | Purpose |\n| --------------------- | ------- |\n| `required`            | Require a submitted value. |\n| `dateObject`          | Validate day/month/year object fields. |\n| `email`               | Validate email addresses. |\n| `inArray`             | Require values from an allowed list. |\n| `nino`                | Validate National Insurance numbers. |\n| `postalAddressObject` | Validate postal address objects. |\n| `range`               | Validate numeric range constraints. |\n| `regex`               | Validate against a regular expression. |\n| `strlen`              | Validate string length constraints. |\n| `wordCount`           | Validate word count constraints. |\n\n# Error handling\n\nValidators return `ValidationError` values. Successful validation clears the\npage's validation state. Failed validation stores field errors in the Journey\nContext and exposes GOV.UK-formatted error summaries to templates.\n\n# Custom validators\n\nCustom validators extend `ValidatorFactory`, define a unique `name`, and\nprovide a `validate(value, dataContext)` method. They may also provide a\n`sanitise(value)` method.\n\n# Citations\n\n[1] [Fields and validation](https://github.com/dwp/govuk-casa/blob/main/docs/fields.md)\n[2] [built-in validators](https://github.com/dwp/govuk-casa/tree/main/src/lib/validators)"},"concepts/waypoint.md":{"id":"concepts/waypoint.md","type":"Domain Concept","title":"Waypoint","description":"A named, visitable node in a CASA Plan graph.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[journey, graph, routing]","route_aliases":["concepts-waypoint"],"exchange_id":"","source_id":"","section":"concepts","source":"wiki/concepts/waypoint.md","body":"A waypoint is the abstract location a user can visit in a [Plan](/concepts/plan.md).\nMost waypoints are implemented by a [Page](/concepts/page.md), but a waypoint\ncan also be an exit node that redirects to another sub-application.\n\n# Syntax\n\nValid waypoint identifiers are strings. Common forms include:\n\n* `personal-details`\n* `check-your-answers`\n* `money/bank-accounts`\n* `url:///other-app/`\n\n`url://` waypoints must include a trailing slash. They indicate an exit from\nthe current Plan rather than a form page inside it.\n\n# Relationships\n\n* A [Route](/concepts/route.md) connects one waypoint to another.\n* A [Page](/concepts/page.md) gives a waypoint a concrete Nunjucks view and\n  field list.\n* [Journey Context](/concepts/journey-context.md) stores page data and\n  validation keyed by waypoint.\n\n# Citations\n\n[1] [Plan terminology](https://github.com/dwp/govuk-casa/blob/main/docs/plan.md)"},"examples/barebones.md":{"id":"examples/barebones.md","type":"Example Application","title":"Barebones example","description":"A minimal CASA application showing pages, fields, plan, events, and a custom plugin.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[example, setup, minimal]","route_aliases":["examples-barebones"],"exchange_id":"","source_id":"","section":"examples","source":"wiki/examples/barebones.md","body":"The barebones example is the quickest reference for how a service wires CASA\ntogether. It includes an application entrypoint, server, view templates, page\ndefinitions, field definitions, a Plan, events, locales, and two example\nplugins.\n\n# Use it for\n\n* Seeing the minimal shape of a CASA app.\n* Copying the separation between `app.js`, `server.js`, definitions, views, and\n  locales.\n* Understanding how page definitions reference fields and templates.\n\n# Related concepts\n\nSee [`configure()`](/concepts/configure.md), [Plan](/concepts/plan.md),\n[Page](/concepts/page.md), [Field](/concepts/field.md), and\n[Plugins](/concepts/plugins.md).\n\n# Citations\n\n[1] [Barebones example](https://github.com/dwp/govuk-casa/tree/main/examples/barebones)"},"examples/dwp-frontend.md":{"id":"examples/dwp-frontend.md","type":"Example Application","title":"DWP Frontend example","description":"CASA example showing use of DWP frontend assets and layouts alongside CASA.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[example, frontend, dwp]","route_aliases":["examples-dwp-frontend"],"exchange_id":"","source_id":"","section":"examples","source":"wiki/examples/dwp-frontend.md","body":"The DWP Frontend example demonstrates how a CASA app can use DWP-specific\nfrontend assets and page layouts while retaining CASA's journey, validation,\nand templating patterns.\n\n# Use it for\n\n* Checking how extra frontend assets are compiled and served.\n* Seeing custom layouts layered around CASA journey pages.\n* Comparing locale-driven page content with the other examples.\n\n# Related concepts\n\nSee [Templating](/concepts/templating.md), [Routers and middleware](/concepts/routers-and-middleware.md),\nand [Internationalisation](/concepts/i18n.md).\n\n# Citations\n\n[1] [DWP Frontend example](https://github.com/dwp/govuk-casa/tree/main/examples/dwp-frontend)"},"examples/fully-loaded.md":{"id":"examples/fully-loaded.md","type":"Example Application","title":"Fully loaded example","description":"A larger CASA example with branching journeys, sub-app structure, hooks, and richer field definitions.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[example, routing, sub-apps]","route_aliases":["examples-fully-loaded"],"exchange_id":"","source_id":"","section":"examples","source":"wiki/examples/fully-loaded.md","body":"The fully loaded example demonstrates more of CASA's application surface than\nthe barebones example. It includes multiple page types, branching journey\ndefinitions, hooks, global events, locales, and a sub-application.\n\n# Use it for\n\n* Studying conditional routing in a realistic Plan.\n* Seeing how a sub-app can be integrated.\n* Finding examples of page hooks and global hooks.\n* Comparing form templates for common GOV.UK form patterns.\n\n# Related concepts\n\nSee [Route](/concepts/route.md), [Hooks](/concepts/hooks.md),\n[Internationalisation](/concepts/i18n.md), and [Templating](/concepts/templating.md).\n\n# Citations\n\n[1] [Fully loaded example](https://github.com/dwp/govuk-casa/tree/main/examples/fully-loaded)"},"examples/index.md":{"id":"examples/index.md","type":"Index","title":"Example applications","description":"Barebones - Minimal CASA service showing the core setup pattern.","timestamp":"","aliases":"","tags":"","route_aliases":["examples-index"],"exchange_id":"","source_id":"","section":"examples","source":"wiki/examples/index.md","body":"# Example applications\n\n* [Barebones](barebones.md) - Minimal CASA service showing the core setup pattern.\n* [Fully loaded](fully-loaded.md) - Richer example that exercises more framework features.\n* [DWP Frontend](dwp-frontend.md) - Example integrating DWP frontend assets and layouts.\n* [Multiapp](multiapp.md) - Example with multiple CASA apps mounted together."},"examples/multiapp.md":{"id":"examples/multiapp.md","type":"Example Application","title":"Multiapp example","description":"CASA example showing multiple sub-apps mounted into one Express service.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[example, multi-app, mounting]","route_aliases":["examples-multiapp"],"exchange_id":"","source_id":"","section":"examples","source":"wiki/examples/multiapp.md","body":"The multiapp example demonstrates how more than one CASA application can be\nmounted into a single Express service. It is useful when a product needs\nseparate journey modules that still participate in a wider service.\n\n# Use it for\n\n* Understanding how `mount()` behaves for multiple CASA apps.\n* Seeing how app-specific views, locales, Plans, and definitions stay isolated.\n* Reviewing route hand-off patterns between mounted apps.\n\n# Related concepts\n\nSee [`mount()`](/concepts/mount.md), [Plan](/concepts/plan.md), and\n[Waypoint](/concepts/waypoint.md).\n\n# Citations\n\n[1] [Multiapp example](https://github.com/dwp/govuk-casa/tree/main/examples/multiapp)"},"index.md":{"id":"index.md","type":"Index","title":"CASA Knowledge Bundle","description":"An Open Knowledge Format","timestamp":"","aliases":"","tags":"","route_aliases":["index"],"exchange_id":"","source_id":"","section":"root","source":"wiki/index.md","body":"# CASA Knowledge Bundle\n\nAn [Open Knowledge Format](https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md)\nbundle describing **CASA** (`@dwp/govuk-casa`) — a Node.js / ExpressJS\nframework for building multi-page, GOV.UK Design System forms. This bundle\ncaptures the framework's core concepts, extension points, request flow,\nbuilt-in validators, example apps, and the external standards it builds on.\n\nOpen the generated [HTML viewer](../viewer.html) for search, graph navigation,\nand rendered Markdown browsing.\n\nStart here, then open individual concepts for detail. Cross-links use\nbundle-relative paths (beginning with `/`).\n\n# Core concepts\n\n* [CASA Framework](concepts/casa-framework.md) - Top-level overview of what CASA is and how its pieces fit together.\n* [configure()](concepts/configure.md) - The single entrypoint that wires up all routers, middleware, and the mount function.\n* [mount()](concepts/mount.md) - Seals configuration and mounts CASA onto an ExpressJS app.\n* [The Plan](concepts/plan.md) - Directed-graph blueprint of every journey a user can take.\n* [Waypoint](concepts/waypoint.md) - A visitable node in the Plan graph.\n* [Route](concepts/route.md) - A conditional edge connecting two waypoints.\n* [Journey Context](concepts/journey-context.md) - The per-user state (data + validation) of a journey.\n* [Page](concepts/page.md) - The concrete, interactive form that renders a waypoint.\n* [Field](concepts/field.md) - A single form input, its processors and validators.\n* [Validation](concepts/validation.md) - The validator system and the ten built-in rules.\n\n# Extension points\n\n* [Hooks](concepts/hooks.md) - Insert middleware at named points in the request lifecycle.\n* [Events](concepts/events.md) - React synchronously to Journey Context changes.\n* [Plugins](concepts/plugins.md) - Bundle config/bootstrap/template changes into reusable units.\n* [Edit mode](concepts/edit-mode.md) - Let users revisit and amend earlier answers.\n\n# Request flow & rendering\n\n* [Request lifecycle](concepts/request-lifecycle.md) - Ordered passage of a request through CASA's stages.\n* [Routers & middleware](concepts/routers-and-middleware.md) - The artifacts `configure()` returns and their mount order.\n* [Templating](concepts/templating.md) - Nunjucks layouts, blocks, macros, and error pages.\n* [Internationalisation](concepts/i18n.md) - Multi-language dictionaries via i18next.\n\n# Supporting material\n\n* [Concepts index](concepts/) - All architecture concepts.\n* [Examples](examples/) - The four bundled example applications.\n* [Playbooks](playbooks/) - Step-by-step task guides for common CASA work.\n* [References](references/) - External standards and libraries CASA depends on."},"log.md":{"id":"log.md","type":"Log","title":"Bundle Update Log","description":"","timestamp":"","aliases":"","tags":"","route_aliases":["log"],"exchange_id":"","source_id":"","section":"root","source":"wiki/log.md","body":"# Bundle Update Log\n\n## 2026-06-30\n* **Creation**: Added a Playwright-captured [OKF viewer user manual](/playbooks/viewer-user-manual.md) with screenshots for the generated graph viewer.\n* **Creation**: Added a generated root [HTML viewer](../viewer.html) and sync scripts for browsing the OKF bundle as a searchable graph.\n* **Initialization**: Created the CASA OKF knowledge bundle targeting OKF v0.1, describing `@dwp/govuk-casa` at version 9.4.4.\n* **Creation**: Authored core architecture concepts under [/concepts](/concepts/), covering the [Plan](/concepts/plan.md), [Journey Context](/concepts/journey-context.md), [Pages](/concepts/page.md), [Fields](/concepts/field.md), and [Validation](/concepts/validation.md).\n* **Creation**: Documented extension points — [Hooks](/concepts/hooks.md), [Events](/concepts/events.md), and [Plugins](/concepts/plugins.md).\n* **Creation**: Captured the [request lifecycle](/concepts/request-lifecycle.md) and [routers & middleware](/concepts/routers-and-middleware.md) ordering.\n* **Creation**: Added the four bundled [examples](/examples/) and a [setup playbook](/playbooks/setting-up-a-casa-app.md).\n* **Creation**: Added [references](/references/) to the GOV.UK Design System, govuk-frontend, ExpressJS, i18next, and Nunjucks."},"playbooks/adding-a-waypoint-page.md":{"id":"playbooks/adding-a-waypoint-page.md","type":"Playbook","title":"Adding a waypoint page","description":"Add a new page to a CASA journey by updating fields, views, pages, and Plan routes together.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[pages, journey, playbook]","route_aliases":["playbooks-adding-a-waypoint-page"],"exchange_id":"","source_id":"","section":"playbooks","source":"wiki/playbooks/adding-a-waypoint-page.md","body":"# Steps\n\n1. Choose a stable [Waypoint](/concepts/waypoint.md) identifier.\n2. Create the Nunjucks page template using `casa/layouts/journey.njk`.\n3. Define [Fields](/concepts/field.md) for every submitted input.\n4. Attach validators and processors to those fields.\n5. Add a [Page](/concepts/page.md) entry with `waypoint`, `view`, and `fields`.\n6. Add or update [Routes](/concepts/route.md) in the [Plan](/concepts/plan.md).\n7. Add locale dictionary entries for labels, hints, and validation errors.\n8. Add tests or persona coverage for the new route.\n\n# Common mistakes\n\n* Adding a template without adding the page to `configure({ pages })`.\n* Adding a page without connecting it in the Plan.\n* Forgetting that fields not declared on the page are pruned from `req.body`.\n* Using a complex field deeper than one property level.\n\n# Citations\n\n[1] [Pages documentation](https://github.com/dwp/govuk-casa/blob/main/docs/pages.md)\n[2] [Fields and validation](https://github.com/dwp/govuk-casa/blob/main/docs/fields.md)"},"playbooks/index.md":{"id":"playbooks/index.md","type":"Index","title":"Playbooks","description":"Setting up a CASA app - Minimal steps to build a service around CASA.","timestamp":"","aliases":"","tags":"","route_aliases":["playbooks-index"],"exchange_id":"","source_id":"","section":"playbooks","source":"wiki/playbooks/index.md","body":"# Playbooks\n\n* [Setting up a CASA app](setting-up-a-casa-app.md) - Minimal steps to build a service around CASA.\n* [Adding a waypoint page](adding-a-waypoint-page.md) - Add a page, fields, template, and Plan route.\n* [Troubleshooting validation](troubleshooting-validation.md) - Diagnose validation and error-rendering issues.\n* [OKF viewer user manual](viewer-user-manual.md) - Screenshot-backed guide to browsing the generated OKF viewer."},"playbooks/setting-up-a-casa-app.md":{"id":"playbooks/setting-up-a-casa-app.md","type":"Playbook","title":"Setting up a CASA app","description":"Minimal sequence for creating and mounting a CASA application.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[setup, playbook]","route_aliases":["playbooks-setting-up-a-casa-app"],"exchange_id":"","source_id":"","section":"playbooks","source":"wiki/playbooks/setting-up-a-casa-app.md","body":"# Steps\n\n1. Install `@dwp/govuk-casa` into an Express project.\n2. Define a [Plan](/concepts/plan.md) in its own module.\n3. Define [Pages](/concepts/page.md) and attach [Fields](/concepts/field.md).\n4. Create Nunjucks templates under an application views directory.\n5. Create locale dictionaries for supported languages.\n6. Call [`configure()`](/concepts/configure.md) with views, session settings,\n   Plan, pages, i18n directories, hooks/events/plugins as needed.\n7. Create an Express app and call [`mount()`](/concepts/mount.md).\n8. Start the parent Express server.\n\n# Checkpoints\n\n* Use a production session store instead of the default MemoryStore.\n* Set a strong session secret.\n* Keep `views` and `i18n.dirs` explicit.\n* Confirm the first waypoint can be reached or use `serveFirstWaypoint`.\n\n# Citations\n\n[1] [Setting up a CASA app](https://github.com/dwp/govuk-casa/blob/main/docs/setup.md)"},"playbooks/troubleshooting-validation.md":{"id":"playbooks/troubleshooting-validation.md","type":"Playbook","title":"Troubleshooting validation","description":"Diagnose why CASA validation did not run, did not persist, or did not render as expected.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[validation, debugging, playbook]","route_aliases":["playbooks-troubleshooting-validation"],"exchange_id":"","source_id":"","section":"playbooks","source":"wiki/playbooks/troubleshooting-validation.md","body":"# Checks\n\n1. Confirm the field is declared in the page's `fields` list.\n2. Confirm the submitted input name matches the [Field](/concepts/field.md)\n   name exactly.\n3. Check whether field conditions are returning `false`.\n4. Check whether a processor is returning a falsy value that templates will not\n   re-display.\n5. Confirm validators return `ValidationError` values, not arbitrary objects.\n6. Confirm the page template passes `formErrors` and `formErrorsGovukArray` into\n   the CASA or GOV.UK components.\n7. If errors disappear on GET, review page or global `errorVisibility`.\n\n# Useful hooks\n\nUse `journey.postsanitise`, `journey.postgather`, and `journey.postvalidate`\nwhen inspecting how a submitted value moved through the request lifecycle.\n\n# Citations\n\n[1] [Fields and validation](https://github.com/dwp/govuk-casa/blob/main/docs/fields.md)\n[2] [Request lifecycle](https://github.com/dwp/govuk-casa/blob/main/docs/request-lifecycle.md)"},"playbooks/viewer-user-manual.md":{"id":"playbooks/viewer-user-manual.md","type":"Playbook","title":"OKF viewer user manual","description":"Screenshot-backed guide to browsing the generated GOV.UK CASA OKF viewer.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[viewer, graph, okf, playbook]","route_aliases":["playbooks-viewer-user-manual"],"exchange_id":"","source_id":"","section":"playbooks","source":"wiki/playbooks/viewer-user-manual.md","body":"# GOV.UK CASA OKF Viewer User Manual\n\nThis manual covers the generated [HTML viewer](../../viewer.html) for this\nOpen Knowledge Format bundle. The viewer is built from the Markdown files under\n`wiki/`, including the [CASA Framework](/concepts/casa-framework.md),\n[The Plan](/concepts/plan.md), [Validation](/concepts/validation.md), example\napps, playbooks, and references.\n\n# Open the viewer\n\nOpen `viewer.html` from the repository root, or serve the repository locally and\nopen `/viewer.html` in a browser. The viewer loads the OKF graph from embedded\nJSON generated by `scripts/update_viewer.py`.\n\nThe header gives access to browser-style back and forward navigation, Home, the\nactive corpus selector, the upstream repository, and the source Markdown page.\n\n![Overview graph screenshot](../assets/viewer-manual/01-overview-graph.jpg)\n\n# Layout\n\nThe viewer has three main panes:\n\n* The left pane lists pages grouped by section and includes search.\n* The centre pane switches between Narrative, Timeline, Graph, and Links views.\n* The right pane shows metadata, incoming and outgoing link chips, and rendered\n  Markdown for the selected page.\n\nThe counter in the lower right of the graph area reports how many pages are\nshown, the total page count, and the total directed link count for the corpus.\n\n# Search and filter\n\nUse the search box to filter by title, type, description, tags, source path, or\nsource ID. Searching for a domain term such as `validation` narrows the left\nnavigation to matching OKF pages, including the [Validation](/concepts/validation.md)\nconcept and related playbooks.\n\nSelecting a search result updates the graph, detail pane, link chips, and URL\nhash together.\n\n![Search validation screenshot](../assets/viewer-manual/02-search-validation.jpg)\n\n# Browse the directed graph\n\nThe Graph view is the fastest way to understand relationships. By default it\nshows a focus graph for the selected page: the selected node is central, with\nincoming and outgoing linked pages around it.\n\nUse the Graph toolbar to:\n\n* Switch between Focus Graph and Overview Graph.\n* Toggle directed Edges on or off.\n* Zoom out, reset to 100 percent, or zoom in.\n* Click a node to make it the active page.\n* Click an edge or an edge row to inspect the relationship source and target.\n\nFor example, selecting [The Plan](/concepts/plan.md) highlights links to\n[Waypoint](/concepts/waypoint.md), [Route](/concepts/route.md), and\n[Journey Context](/concepts/journey-context.md).\n\n![Plan focus graph screenshot](../assets/viewer-manual/03-plan-focus-graph.jpg)\n\n# Use Links view\n\nLinks view turns the graph relationship data into two lists: outgoing links from\nthe selected page and incoming links back to it. This is useful when the graph\nis dense or when you want to audit how a concept is referenced.\n\nFor [The Plan](/concepts/plan.md), outgoing links show the core graph concepts\nit depends on, while incoming links show examples, setup guidance, and other\nconcept pages that point back to the Plan.\n\n![Plan links view screenshot](../assets/viewer-manual/04-plan-links-view.jpg)\n\n# Use Narrative view\n\nNarrative view renders the selected Markdown page in the centre pane. For normal\nconcepts and playbooks it mirrors the right-hand detail content in a wider\nreading area. The right pane remains useful for quick metadata, graph chips, and\nsource path checks.\n\n![Plan narrative view screenshot](../assets/viewer-manual/05-plan-narrative-view.jpg)\n\n# Update the viewer\n\nMarkdown is the source of truth. Do not hand-edit `viewer.html`.\n\nAfter changing pages under `wiki/`, regenerate and check the viewer:\n\n```sh\npython3 scripts/update_viewer.py\npython3 scripts/check_wiki_viewer.py\npython3 scripts/update_viewer.py --check\n```\n\nThe checker verifies required OKF pages, graph links, route aliases, and whether\n`viewer.html` matches the current Markdown corpus."},"references/express.md":{"id":"references/express.md","type":"External Reference","title":"ExpressJS","description":"The Node.js web framework onto which CASA mounts routers and middleware.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[express, nodejs, runtime]","route_aliases":["references-express"],"exchange_id":"","source_id":"","section":"references","source":"wiki/references/express.md","body":"CASA is built as an ExpressJS framework. It returns Express-compatible routers\nand middleware from [`configure()`](/concepts/configure.md), then mounts them\nthrough [`mount()`](/concepts/mount.md).\n\n# Citations\n\n[1] [ExpressJS](https://expressjs.com/)"},"references/govuk-design-system.md":{"id":"references/govuk-design-system.md","type":"External Reference","title":"GOV.UK Design System","description":"The UK government design system used as CASA's accessibility and component foundation.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[govuk, design-system, accessibility]","route_aliases":["references-govuk-design-system"],"exchange_id":"","source_id":"","section":"references","source":"wiki/references/govuk-design-system.md","body":"CASA adopts the GOV.UK Design System so services start from established\npatterns, components, and accessibility guidance. CASA's bundled components are\nwrappers around GOV.UK component macros.\n\n# Related concepts\n\nSee [CASA Framework](/concepts/casa-framework.md) and\n[Templating](/concepts/templating.md).\n\n# Citations\n\n[1] [GOV.UK Design System](https://design-system.service.gov.uk/)"},"references/govuk-frontend.md":{"id":"references/govuk-frontend.md","type":"External Reference","title":"govuk-frontend","description":"The npm package that supplies GOV.UK Frontend templates, macros, assets, and JavaScript.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[govuk, frontend, templates]","route_aliases":["references-govuk-frontend"],"exchange_id":"","source_id":"","section":"references","source":"wiki/references/govuk-frontend.md","body":"`govuk-frontend` is a runtime dependency of CASA. CASA includes it in the\nNunjucks lookup path and serves its assets through the static router.\n\n# Related concepts\n\nSee [Templating](/concepts/templating.md) and\n[Routers and middleware](/concepts/routers-and-middleware.md).\n\n# Citations\n\n[1] [govuk-frontend repository](https://github.com/alphagov/govuk-frontend)"},"references/i18next.md":{"id":"references/i18next.md","type":"External Reference","title":"i18next","description":"The translation library CASA uses for request and template localisation.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[i18n, localisation]","route_aliases":["references-i18next"],"exchange_id":"","source_id":"","section":"references","source":"wiki/references/i18next.md","body":"CASA uses i18next to load JSON and YAML dictionaries and expose translation\nfunctions to code and templates.\n\n# Related concepts\n\nSee [Internationalisation](/concepts/i18n.md).\n\n# Citations\n\n[1] [i18next documentation](https://www.i18next.com/)"},"references/index.md":{"id":"references/index.md","type":"Index","title":"References","description":"OKF v0.1 specification - The format used by this wiki bundle.","timestamp":"","aliases":"","tags":"","route_aliases":["references-index"],"exchange_id":"","source_id":"","section":"references","source":"wiki/references/index.md","body":"# References\n\n* [OKF v0.1 specification](okf-spec.md) - The format used by this wiki bundle.\n* [GOV.UK Design System](govuk-design-system.md) - The design system CASA adopts.\n* [govuk-frontend](govuk-frontend.md) - The package that provides GOV.UK templates and macros.\n* [ExpressJS](express.md) - The web framework CASA mounts onto.\n* [Nunjucks](nunjucks.md) - The templating engine CASA uses.\n* [i18next](i18next.md) - The translation engine CASA uses."},"references/nunjucks.md":{"id":"references/nunjucks.md","type":"External Reference","title":"Nunjucks","description":"The template engine used by CASA for pages, layouts, macros, and error rendering.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[templates, rendering]","route_aliases":["references-nunjucks"],"exchange_id":"","source_id":"","section":"references","source":"wiki/references/nunjucks.md","body":"CASA configures a Nunjucks environment for service templates, bundled CASA\ntemplates, and GOV.UK Frontend templates. Plugins can use CASA's specialised\nloader to modify named template blocks.\n\n# Related concepts\n\nSee [Templating](/concepts/templating.md) and [Plugins](/concepts/plugins.md).\n\n# Citations\n\n[1] [Nunjucks documentation](https://mozilla.github.io/nunjucks/)"},"references/okf-spec.md":{"id":"references/okf-spec.md","type":"External Reference","title":"Open Knowledge Format v0.1","description":"Google's draft specification for markdown-and-frontmatter knowledge bundles.","timestamp":"2026-06-30T00:00:00Z","aliases":"","tags":"[okf, specification, format]","route_aliases":["references-okf-spec"],"exchange_id":"","source_id":"","section":"references","source":"wiki/references/okf-spec.md","body":"This wik function md(text){const lines=String(text||"").split("\n");let html="",inList=false,inCode=false,codeLang="",buf=[];function closeList(){if(inList){html+="</ul>";inList=false;}}function flushCode(){if(inCode){const code=buf.join("\n");html+=codeLang==="mermaid"?mermaidLite(code):`<pre><code>${codeBlock(code)}</code></pre>`;buf=[];inCode=false;codeLang="";}}for(let i=0;i<lines.length;i++){const line=lines[i];if(line.startsWith("```")){if(inCode)flushCode();else{closeList();inCode=true;codeLang=line.slice(3).trim().toLowerCase();buf=[];}continue;}if(inCode){buf.push(line);continue;}if(isTableLine(line)&&isDelimiterLine(lines[i+1]||"")){closeList();const rows=[line];i+=2;while(i<lines.length&&isTableLine(lines[i])){rows.push(lines[i]);i++;}i--;html+=renderTable(rows);continue;}if(!line.trim()){closeList();continue;}let m;if((m=/^###\s+(.+)/.exec(line))){closeList();html+=`<h3>${inline(m[1])}</h3>`;}else if((m=/^##\s+(.+)/.exec(line))){closeList();html+=`<h2>${inline(m[1])}</h2>`;}else if((m=/^#\s+(.+)/.exec(line))){closeList();html+=`<h1>${inline(m[1])}</h1>`;}else if((m=/^-\s+(.+)/.exec(line))){if(!inList){html+="<ul>";inList=true;}html+=`<li>${inline(m[1])}</li>`;}else{closeList();html+=`<p>${inline(line)}</p>`;}}flushCode();closeList();return html;}

function labelBox(id,p,r){const text=G.nodes[id].title.slice(0,54);return{x:p.x+r+7,y:p.y-9,w:Math.min(340,text.length*6.2+14),h:18};}
function boxOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function labelLayers(ids,pos){const always=ids.includes(selected)&&pos[selected]?[{id:selected,box:labelBox(selected,pos[selected],nodeRadius(selected))}]:[];const alwaysBoxes=always.map(item=>item.box);const raw=ids.filter(id=>id!==selected).map(id=>({id,box:pos[id]?labelBox(id,pos[id],nodeRadius(id)):null})).filter(item=>item.box);const candidates=raw.filter(item=>!alwaysBoxes.some(box=>boxOverlap(item.box,box)));const conflicts=new Set();candidates.forEach((item,i)=>{for(let j=i+1;j<candidates.length;j++){if(boxOverlap(item.box,candidates[j].box)){conflicts.add(item.id);conflicts.add(candidates[j].id);}}});const free=candidates.filter(item=>!conflicts.has(item.id));const layered=candidates.filter(item=>conflicts.has(item.id)).sort((a,b)=>G.nodes[a.id].title.localeCompare(G.nodes[b.id].title));const layers=[];layered.forEach(item=>{let placed=false;for(let i=0;i<layers.length;i++){if(!layers[i].some(other=>boxOverlap(item.box,other.box))){layers[i].push(item);placed=true;break;}}if(!placed)layers.push([item]);});labelLayerCount=Math.max(1,layers.length);const active=layers.length?(layers[labelPhase%labelLayerCount]||[]):[];return new Set([...always.map(item=>item.id),...free.map(item=>item.id),...active.map(item=>item.id)]);}
function labelSet(ids,pos){return labelLayers(ids,pos);}
function edgePairKey(edge){return edge[0]<edge[1]?`${edge[0]}|${edge[1]}`:`${edge[1]}|${edge[0]}`;}
function edgeLabelText(edge){return edge[2]||"wiki link";}
function edgeLabelPlan(items){const groups={};items.forEach(item=>{const key=edgePairKey(item.edge);(groups[key]||(groups[key]=[])).push(item);});const plan=new Map();Object.values(groups).forEach(group=>{const labels=[...new Set(group.map(item=>edgeLabelText(item.edge)))];if(group.length>1&&labels.length===1){const first=group.slice().sort((a,b)=>a.i-b.i)[0];group.forEach(item=>plan.set(item.i,{show:item.i===first.i,t:.5}));}else group.forEach(item=>plan.set(item.i,{show:true,t:(group.length>1 ? .34 : .5)}));});return plan;}
function edgePath(edge,pos,labelT=.5){const a=edge[0],b=edge[1],pa=pos[a],pb=pos[b],ra=nodeRadius(a),rb=nodeRadius(b);const dx=pb.x-pa.x,dy=pb.y-pa.y,len=Math.max(1,Math.hypot(dx,dy)),ux=dx/len,uy=dy/len;const sx=pa.x+ux*(ra+3),sy=pa.y+uy*(ra+3),tx=pb.x-ux*(rb+9),ty=pb.y-uy*(rb+9);const reverse=G.edges.some(other=>other[0]===b&&other[1]===a);const bend=reverse?22*(a<b?1:-1):0;const mx=(sx+tx)/2,my=(sy+ty)/2,cx=mx-uy*bend,cy=my+ux*bend;const t=Math.max(.2,Math.min(.8,labelT)),u=1-t,lx=u*u*sx+2*u*t*cx+t*t*tx,ly=u*u*sy+2*u*t*cy+t*t*ty-7;return{d:`M${sx} ${sy} Q${cx} ${cy} ${tx} ${ty}`,lx,ly};}
function graphViewBox(w,h){const z=Math.max(.7,Math.min(3,graphZoom)),vw=w/z,vh=h/z,baseX=(w-vw)/2,baseY=(h-vh)/2,padX=w*.35,padY=h*.35;graphPanX=Math.max(-baseX-padX,Math.min(baseX+padX,graphPanX));graphPanY=Math.max(-baseY-padY,Math.min(baseY+padY,graphPanY));return`${baseX+graphPanX} ${baseY+graphPanY} ${vw} ${vh}`;}
function applyGraphViewBox(){const w=graph.clientWidth||900,h=graph.clientHeight||650;graph.setAttribute("viewBox",graphViewBox(w,h));}
function setGraphZoom(value){graphZoom=Math.max(.7,Math.min(3,value));zoomReset.textContent=`${Math.round(graphZoom*100)}%`;renderGraph();}
function resetGraphView(){graphZoom=1;graphPanX=0;graphPanY=0;zoomReset.textContent="100%";renderGraph();}
function beginGraphPan(e){if(e.button!==undefined&&e.button!==0)return;graphSuppressClick=false;graphDrag={x:e.clientX,y:e.clientY,panX:graphPanX,panY:graphPanY,moved:false,captured:false};graph.classList.add("dragging");}
function moveGraphPan(e){if(!graphDrag)return;const dx=e.clientX-graphDrag.x,dy=e.clientY-graphDrag.y,z=Math.max(.7,Math.min(3,graphZoom));if(Math.hypot(dx,dy)>3){graphDrag.moved=true;graphSuppressClick=true;if(!graphDrag.captured&&graph.setPointerCapture){graph.setPointerCapture(e.pointerId);graphDrag.captured=true;}}if(!graphDrag.moved)return;e.preventDefault();graphPanX=graphDrag.panX-dx/z;graphPanY=graphDrag.panY-dy/z;applyGraphViewBox();}
function endGraphPan(e){if(!graphDrag)return;const moved=graphDrag.moved,captured=graphDrag.captured;graphDrag=null;graph.classList.remove("dragging");try{if(captured&&graph.releasePointerCapture)graph.releasePointerCapture(e.pointerId);}catch{}if(!moved)graphSuppressClick=false;else setTimeout(()=>{graphSuppressClick=false;},80);}
function suppressGraphClick(e){if(!graphSuppressClick)return;e.preventDefault();e.stopPropagation();graphSuppressClick=false;}
function renderGraph(){const w=graph.clientWidth||900,h=graph.clientHeight||650;applyGraphViewBox();const ids=visibleGraphIds();const visible=new Set(ids);const pos=graphPositions(ids,w,h);const labels=labelSet(ids,pos);const visibleEdges=[];let edgeSvg=`<defs><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path class="edgeArrow" d="M0,0 L10,4 L0,8 Z"></path></marker><marker id="arrowheadActive" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path class="edgeArrowActive" d="M0,0 L10,4 L0,8 Z"></path></marker></defs>`,hitSvg="",labelSvg="",nodeSvg="";if(showLinks){G.edges.forEach((edge,i)=>{const a=edge[0],b=edge[1],incident=a===selected||b===selected;if(visible.has(a)&&visible.has(b)&&pos[a]&&pos[b]&&(graphMode==="overview"||incident))visibleEdges.push({edge,i});});const labelPlan=edgeLabelPlan(visibleEdges);visibleEdges.forEach(item=>{const edge=item.edge,type=edge[2]||"wiki link",label=edge[3]||type;const active=graphFocus&&graphFocus.source===edge[0]&&graphFocus.target===edge[1]&&graphFocus.type===type;const planned=labelPlan.get(item.i)||{show:true,t:.5};const path=edgePath(edge,pos,(active&&!planned.show)?.5:planned.t);edgeSvg+=`<path class="edge ${active?"active":""}" data-edge="${item.i}" d="${path.d}" marker-end="url(#${active?"arrowheadActive":"arrowhead"})"><title>${esc(type)}: ${esc(G.nodes[edge[0]].title)} -> ${esc(G.nodes[edge[1]].title)}${label?` (${esc(label)})`:""}</title></path>`;hitSvg+=`<path class="edgeHit" data-edge="${item.i}" d="${path.d}"></path>`;if((planned.show||active)&&((graphMode==="focus"&&visibleEdges.length<=16)||active))labelSvg+=`<text class="edgeLabel ${active?"active":""}" x="${path.lx}" y="${path.ly}" text-anchor="middle">${esc(type).slice(0,28)}</text>`;});}for(const id of ids){const n=G.nodes[id],p=pos[id]||{x:w/2,y:h/2};const active=id===selected;const r=nodeRadius(id);nodeSvg+=`<g class="node ${active?"active":""}" data-page="${attr(id)}"><circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${color(n.section)}"/><title>${esc(n.title)}</title>${labels.has(id)?`<text x="${p.x+r+7}" y="${p.y+4}">${esc(n.title).slice(0,54)}</text>`:""}</g>`;}graph.innerHTML=edgeSvg+hitSvg+labelSvg+nodeSvg;bindEdgeButtons(graph);graph.querySelectorAll("[data-page]").forEach(el=>el.addEventListener("click",e=>{e.preventDefault();pick(el.dataset.page);}));renderGraphInfo();}
collapseNav.onclick=()=>setNavCollapsed(true);navRail.onclick=()=>setNavCollapsed(false);backBtn.onclick=()=>history.back();forwardBtn.onclick=()=>history.forward();document.querySelectorAll(".viewBtn").forEach(btn=>btn.addEventListener("click",()=>{currentView=btn.dataset.view;renderStage();}));document.getElementById("home").onclick=()=>navigate(G.root||"index.md",true);document.getElementById("graphMode").onclick=e=>{graphMode=graphMode==="focus"?"overview":"focus";labelPhase=0;labelLayerCount=1;e.currentTarget.textContent=graphMode==="focus"?"Focus Graph":"Overview Graph";renderStage();};document.getElementById("showLinks").onclick=e=>{showLinks=!showLinks;e.currentTarget.classList.toggle("on",showLinks);renderStage();};zoomOut.onclick=()=>setGraphZoom(graphZoom/1.2);zoomIn.onclick=()=>setGraphZoom(graphZoom*1.2);zoomReset.onclick=resetGraphView;graph.addEventListener("pointerdown",beginGraphPan);graph.addEventListener("pointermove",moveGraphPan);graph.addEventListener("pointerup",endGraphPan);graph.addEventListener("pointercancel",endGraphPan);graph.addEventListener("click",suppressGraphClick,true);graph.addEventListener("dragstart",e=>e.preventDefault());graph.addEventListener("wheel",e=>{if(currentView==="graph"){e.preventDefault();setGraphZoom(graphZoom*(e.deltaY<0?1.12:.89));}},{passive:false});q.addEventListener("input",renderList);window.addEventListener("resize",renderStage);window.addEventListener("popstate",applyLocationFromUrl);window.addEventListener("hashchange",applyLocationFromUrl);
setInterval(()=>{if(currentView==="graph"&&labelLayerCount>1){labelPhase=(labelPhase+1)%labelLayerCount;renderGraph();}},2000);
setCorpus(corpusId,false,false);
