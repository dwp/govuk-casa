function drawGraph() {
  let e = "";
  if (SHOWEDGES) {
    EDGES.forEach(function (ed) {
      const a = POS[ed[0]], b = POS[ed[1]]; if (!a || !b) return;
      const act = ed[0] === CURRENT || ed[1] === CURRENT;
      e += '<line class="edge' + (act ? " active" : "") + '" x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '"/>';
    });
    EDGES.forEach(function (ed) {
      if (!(ed[0] === CURRENT || ed[1] === CURRENT) || !ed[2]) return;
      const a = POS[ed[0]], b = POS[ed[1]]; if (!a || !b) return;
      e += '<text class="edgeLabel active" x="' + (a.x + b.x) / 2 + '" y="' + (a.y + b.y) / 2 + '">' + esc(ed[2]) + "</text>";
    });
  }
  let nh = "";
  GRAPHNODES.forEach(function (id) {
    const p = POS[id], n = NODES[id], col = groupColor(n.group), act = id === CURRENT;
    nh += '<g class="node' + (act ? " active" : "") + '" data-nav="' + esc(id) + '" transform="translate(' + p.x + "," + p.y + ')">' +
      '<circle r="' + (act ? 11 : 7.5) + '" fill="' + col + '"></circle>' +
      '<text dx="13" dy="4">' + esc(n.title) + "</text></g>";
  });
  gWorld.innerHTML = "<g>" + e + "</g><g>" + nh + "</g>";
  applyTransform();
  const n = NODES[CURRENT];
  if (n && !n.reserved) {
    const deg = EDGES.filter(function (x) { return x[0] === CURRENT || x[1] === CURRENT; }).length;
    graphInfo.innerHTML = "<strong>" + esc(n.title) + "</strong>" + esc(n.type) + " &middot; " + deg + " links";
    graphInfo.style.display = "";
  } else { graphInfo.style.display = "none"; }
}
function zoomAt(mx, my, f) {
  const wx = (mx - T.x) / T.k, wy = (my - T.y) / T.k;
  T.k = Math.max(0.2, Math.min(4, T.k * f));
  T.x = mx - wx * T.k; T.y = my - wy * T.k; applyTransform();
  $("zoomReset").textContent = Math.round(T.k * 100) + "%";
}

/* ---------- navigation ---------- */
function setView(v) {
  VIEW = v;
  document.querySelectorAll(".viewBtn").forEach(function (b) { b.classList.toggle("on", b.dataset.view === v); });
  $("graphTools").style.display = v === "graph" ? "" : "none";
  if (v === "graph") { stage.className = "stage mode-graph"; drawGraph(); }
  else { stage.className = "stage mode-panel"; if (v === "links") renderLinksView(CURRENT); else renderIndexView(); }
}
function openNode(id, push) {
  if (!NODES[id]) return;
  if (push !== false && CURRENT && CURRENT !== id) { HIST.push(CURRENT); FWD = []; }
  CURRENT = id;
  renderList(); renderDetail(id);
  if (VIEW === "graph") drawGraph(); else if (VIEW === "links") renderLinksView(id);
  updateNavButtons();
}
function updateNavButtons() { $("backBtn").disabled = !HIST.length; $("forwardBtn").disabled = !FWD.length; }
function goBack() { if (!HIST.length) return; FWD.push(CURRENT); CURRENT = HIST.pop(); renderList(); renderDetail(CURRENT); if (VIEW === "graph") drawGraph(); else if (VIEW === "links") renderLinksView(CURRENT); updateNavButtons(); }
function goForward() { if (!FWD.length) return; HIST.push(CURRENT); CURRENT = FWD.pop(); renderList(); renderDetail(CURRENT); if (VIEW === "graph") drawGraph(); else if (VIEW === "links") renderLinksView(CURRENT); updateNavButtons(); }

/* ---------- wiring ---------- */
function onNavClick(e) {
  const el = e.target.closest("[data-nav]"); if (el) { e.preventDefault(); openNode(el.dataset.nav); return; }
  const tg = e.target.closest("[data-tag]"); if (tg) { e.preventDefault(); qInput.value = tg.dataset.tag; renderList(); }
}
detail.addEventListener("click", onNavClick);
list.addEventListener("click", onNavClick);
stageView.addEventListener("click", onNavClick);
document.querySelectorAll(".viewBtn").forEach(function (b) { b.addEventListener("click", function () { setView(b.dataset.view); }); });
$("home").addEventListener("click", function () { openNode(B.meta.home); });
$("backBtn").addEventListener("click", goBack);
$("forwardBtn").addEventListener("click", goForward);
$("repoLink").href = B.meta.repo; $("specLink").href = B.meta.spec;
qInput.addEventListener("input", renderList);
$("clearQ").addEventListener("click", function () { qInput.value = ""; renderList(); qInput.focus(); });
$("showLinks").addEventListener("click", function () { SHOWEDGES = !SHOWEDGES; this.classList.toggle("on", SHOWEDGES); drawGraph(); });
$("zoomIn").addEventListener("click", function () { const r = svg.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.2); });
$("zoomOut").addEventListener("click", function () { const r = svg.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1 / 1.2); });
$("zoomReset").addEventListener("click", fitView);

let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;
svg.addEventListener("pointerdown", function (e) { dragging = true; moved = false; sx = e.clientX; sy = e.clientY; ox = T.x; oy = T.y; svg.classList.add("dragging"); try { svg.setPointerCapture(e.pointerId); } catch (x) {} });
svg.addEventListener("pointermove", function (e) { if (!dragging) return; const dx = e.clientX - sx, dy = e.clientY - sy; if (Math.abs(dx) + Math.abs(dy) > 4) moved = true; T.x = ox + dx; T.y = oy + dy; applyTransform(); });
svg.addEventListener("pointerup", function (e) { dragging = false; svg.classList.remove("dragging"); try { svg.releasePointerCapture(e.pointerId); } catch (x) {} });
svg.addEventListener("click", function (e) { if (moved) return; const g = e.target.closest(".node"); if (g && g.dataset.nav) openNode(g.dataset.nav); });
svg.addEventListener("wheel", function (e) { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.1 : 1 / 1.1); }, { passive: false });
window.addEventListener("resize", function () { if (VIEW === "graph") fitView(); });
window.addEventListener("keydown", function (e) { if (e.target.tagName === "INPUT") return; if (e.key === "/") { e.preventDefault(); qInput.focus(); } });

/* ---------- init ---------- */
$("title").textContent = B.meta.title;
$("subtitle").textContent = B.meta.subtitle;
count.textContent = GRAPHNODES.length + " concepts · " + EDGES.length + " links";
computeLayout();
CURRENT = B.meta.home;
renderList();
renderDetail(CURRENT);
updateNavButtons();
requestAnimationFrame(function () { fitView(); drawGraph(); });

</script>
</body>
</html>
