*{box-sizing:border-box}html,body{height:100%;margin:0}body{height:100dvh;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}.shell{height:100dvh;display:flex;flex-direction:column;min-height:0}
header{flex:0 0 auto;min-height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 14px;background:#11161b;min-width:0}.titleblock{min-width:240px}h1{font-size:18px;line-height:1.12;margin:0}.sub{color:var(--muted);font-size:12px;max-width:760px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spacer{flex:1}.btn{height:34px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--text);padding:0 11px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:650}.btn:hover{border-color:var(--accent)}.btn.on{background:var(--accent);border-color:var(--accent);color:#06130f}.nav{display:flex;gap:7px;align-items:center;flex-wrap:wrap;min-width:0}.iconbtn{width:34px;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--text);cursor:pointer;font-size:18px;font-weight:750;display:inline-flex;align-items:center;justify-content:center}.iconbtn:hover{border-color:var(--accent)}.iconbtn:disabled{opacity:.38;cursor:not-allowed;border-color:var(--line)}

#list{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 8px 18px}.group{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:13px 8px 5px}.item{display:grid;grid-template-columns:12px 1fr;gap:8px;padding:8px;border-radius:7px;cursor:pointer}.item:hover{background:var(--panel2)}.item.active{background:#273442}.dot{width:10px;height:10px;border-radius:50%;margin-top:5px}.name{font-size:13px;line-height:1.32}.meta{font-size:11px;color:var(--muted);margin-top:2px;word-break:break-word}
.stage{position:relative;min-width:0;min-height:0;background:radial-gradient(circle at 50% 45%,#1d2832 0,#101418 48%);overflow:hidden}#graph{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}#graph.dragging{cursor:grabbing}.stage.mode-panel #graph{display:none}.stage.mode-graph #stageView{display:none}#stageView{position:absolute;inset:0;overflow:auto;padding:62px 18px 48px;background:linear-gradient(180deg,#111820,#0f1419);scrollbar-gutter:stable}.edge{stroke:#7d8796;stroke-width:1.35;opacity:.5;cursor:pointer;pointer-events:stroke;fill:none}.edge.active{stroke:var(--accent);stroke-width:3;opacity:.96}.edgeLabel{font-size:10px;fill:#dbeafe;paint-order:stroke;stroke:#0f1215;stroke-width:4px;stroke-linejoin:round;pointer-events:none}.edgeLabel.active{fill:#fff}.node{cursor:pointer}.node circle{stroke:#0f1215;stroke-width:2.5}.node text{font-size:11px;fill:#edf4fb;paint-order:stroke;stroke:#0f1215;stroke-width:4px;stroke-linejoin:round;pointer-events:none}.node.active circle{stroke:#fff;stroke-width:3.5}.toolbar{position:absolute;z-index:2;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}.graphTools{display:flex;gap:6px}.graphInfo{position:absolute;z-index:2;left:12px;bottom:12px;max-width:min(680px,calc(100% - 210px));border:1px solid var(--line);border-radius:8px;background:rgba(15,18,21,.9);padding:9px 11px;color:var(--muted);font-size:12px}.graphInfo strong{display:block;color:var(--text);font-size:13px}.count{position:absolute;z-index:2;right:12px;bottom:12px;color:var(--muted);background:rgba(15,18,21,.84);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12px}

.viewHead{margin:0 0 14px;max-width:920px}.viewHead h2{font-size:18px;line-height:1.2;margin:0}.viewHead p{color:var(--muted);margin:4px 0 0}.linksGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.linkCard{border:1px solid var(--line);border-radius:8px;background:rgba(34,41,50,.76);box-shadow:0 16px 44px rgba(0,0,0,.18);padding:12px}.linkCard h3{font-size:14px;margin:0 0 8px}.linkCard button{display:block;width:100%;text-align:left;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--text);cursor:pointer}.linkCard button:hover{border-color:var(--accent)}.linkCard small{display:block;color:var(--muted);margin-top:2px}.idxGroup{margin:0 0 18px;max-width:980px}.idxGroup h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}.idxItem{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--text);padding:9px 10px;margin:6px 0;cursor:pointer}.idxItem:hover{border-color:var(--accent)}.idxItem small{display:block;color:var(--muted);margin-top:2px}

<script>
const B={"meta": {"title": "CASA Knowledge Bundle", "subtitle": "OKF 0.1 · @dwp/govuk-casa 9.4.4 — 28 concepts, 134 links", "repo": "https://github.com/dwp/govuk-casa", "spec": "https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md", "home": "index.md"}, "groups": [{"id": "concepts", "label": "Concepts", "color": "#4cc9a7"}, {"id": "examples", "label": "Examples", "color": "#7aa7ff"}, {"id": "playbooks", "label": "Playbooks", "color": "#f2bd63"}, {"id": "references", "label": "References", "color": "#c08cff"}, {"id": "bundle", "label": "Bundle", "color": "#8aa0b3"}], "nodes": {"concepts/casa-framework.md": {"id": "concepts/casa-framework.md", "type": "Framework", "title": "CASA Framework", "description": "A Node.js/ExpressJS framework for building multi-page GOV.UK Design System forms.", "tags": ["overview", "casa", "govuk", "express", "forms"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://github.com/dwp/govuk-casa", "group": "concepts", "reserved": false, "body": "\nCASA (`@dwp/govuk-casa`) is a framework, maintained by the DWP Engineering\nPractice, for building **Collect-And-Submit Applications** — the multi-page,\none-question-per-page web forms common across UK government services. It adopts\nthe [GOV.UK Design System](/references/govuk-design-system.md) for accessible,\nwell-researched markup and runs as a set of [ExpressJS](/references/express.md)\nrouters and middleware.\n\n# What CASA gives you\n\nCASA handles the cross-cutting concerns of a government form service so a team\ncan focus on questions and content:\n\n* **Journey routing** — model every possible path through a service as a\n  directed graph (the [Plan](/concepts/plan.md)), with conditional branching\n  driven by the user's answers.\n* **State management** — capture answers and validation state per user in the\n  [Journey Context](/concepts/journey-context.md), persisted in the server\n  session.\n* **Form pages** — bind a [Page](/concepts/page.md) to each\n  [Waypoint](/concepts/waypoint.md), render it with\n  [Nunjucks templates](/concepts/templating.md), and collect\n  [Fields](/concepts/field.md) validated by built-in or custom\n  [Validators](/concepts/validation.md).\n* **Multi-language** — first-class [internationalisation](/concepts/i18n.md)\n  via i18next.\n* **Extensibility** — a small core extended through [Hooks](/concepts/hooks.md),\n  [Events](/concepts/events.md), and [Plugins](/concepts/plugins.md).\n\n# How the pieces fit together\n\n1. You call [`configure()`](/concepts/configure.md) with your Plan, pages,\n   session settings, and any hooks/events/plugins.\n2. `configure()` returns mutable\n   [routers and middleware](/concepts/routers-and-middleware.md) plus a\n   [`mount()`](/concepts/mount.md) function.\n3. You optionally tweak those artifacts, then call `mount()` to seal everything\n   onto an ExpressJS app.\n4. At request time, CASA passes each request through an ordered\n   [request lifecycle](/concepts/request-lifecycle.md), steering the user\n   through the Plan and rendering the appropriate page.\n\n# Key facts\n\n| Property        | Value                                             |\n| --------------- | ------------------------------------------------- |\n| Package         | `@dwp/govuk-casa`                                 |\n| Version         | 9.4.4                                             |\n| Runtime         | Node.js `\u003e=18 \u003c=22`, ExpressJS 4                  |\n| Module formats  | ESM and CommonJS                                  |\n| Templating      | Nunjucks (+ `govuk-frontend` macros)              |\n| Licence         | ISC                                               |\n| Maintainer      | DWP Engineering Practice                          |\n\n# Getting started\n\nSee the [setup playbook](/playbooks/setting-up-a-casa-app.md) and the\n[barebones example](/examples/barebones.md) for a minimal working application.\n\n# Citations\n\n[1] [CASA README](https://github.com/dwp/govuk-casa/blob/main/README.md)\n[2] [CASA documentation index](https://github.com/dwp/govuk-casa/blob/main/docs/index.md)\n"}, "concepts/configure.md": {"id": "concepts/configure.md", "type": "API Entrypoint", "title": "configure()", "description": "The single entrypoint that builds all CASA routers, middleware, and the mount function.", "tags": ["api", "setup", "configuration"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://github.com/dwp/govuk-casa/blob/main/src/lib/configure.js", "group": "concepts", "reserved": false, "body": "\n`configure()` is the entrypoint for setting up a CASA app. It has **no\nside-effects** on the wider application, so it can safely configure multiple\nCASA sub-apps in the same process. It returns the routers, middleware, and a\n[`mount()`](/concepts/mount.md) function.\n\n```javascript\nimport { configure } from \"@dwp/govuk-casa\";\n\nconst { mount } = configure({ /* options */ });\n\nconst casaApp = express();\nmount(casaApp);\n\nconst app = express();\napp.use(\"/some-mount-url\", casaApp);\napp.listen();\n```\n\n# Options\n\n| Option                  | Type                | Notes                                                                 |\n| ----------------------- | ------------------- | --------------------------------------------------------------------- |\n| `views` *(required)*    | `string[]`          | Nunjucks view directories. See [Templating](/concepts/templating.md). |\n| `session.name` *(req.)* | `string`            | Session cookie name.                                                   |\n| `session.secret` *(req.)* | `string`          | Secret used to sign cookies.                                          |\n| `session.ttl`           | `number`            | Session expiry, in seconds.                                           |\n| `session.secure`        | `boolean`           | Flag the session cookie secure (requires TLS).                        |\n| `session.store`         | `object`            | An `express-session` store (defaults to `MemoryStore`).               |\n| `session.cookieSameSite`| `string\\|boolean`   | `Strict` (default), `Lax`, or `None`.                                 |\n| `mountUrl`              | `string`            | URL prefix; setting it enters proxy mode.                             |\n| `i18n.dirs`             | `string[]`          | Translation search directories. See [i18n](/concepts/i18n.md).        |\n| `i18n.locales`          | `string[]`          | Supported locales.                                                    |\n| `plan`                  | `Plan`              | The [Plan](/concepts/plan.md).                                        |\n| `pages`                 | `object[]`          | [Page](/concepts/page.md) definitions.                                |\n| `hooks`                 | `object[]`          | Global [Hooks](/concepts/hooks.md).                                   |\n| `events`                | `object[]`          | Journey Context [Events](/concepts/events.md).                        |\n| `plugins`               | `object[]`          | [Plugins](/concepts/plugins.md).                                      |\n| `errorVisibility`       | `Symbol\\|Function`  | Keep validation errors visible on GET.                                |\n| `helmetConfigurator`    | `function`          | Modify CASA's default Helmet config.                                  |\n| `formMaxParams`         | `integer`           | Max form parameters to ingest (default `25`).                         |\n| `formMaxBytes`          | `integer\\|string`   | Max form payload (default `50kb`).                                    |\n| `contextIdGenerator`    | `function`          | Custom ephemeral context ID generator (default UUID).                 |\n\n# What it returns\n\nA call to `configure()` returns mutable routers, mutable middleware arrays, and\nthe `mount()` function. Everything can be modified **before** `mount()` is\ncalled and is effectively sealed thereafter. See\n[Routers & middleware](/concepts/routers-and-middleware.md) for the full list\nand the order in which they are mounted.\n\n# Citations\n\n[1] [Setting up a CASA application](https://github.com/dwp/govuk-casa/blob/main/docs/setup.md)\n"}, "concepts/edit-mode.md": {"id": "concepts/edit-mode.md", "type": "Feature", "title": "Edit mode", "description": "Lets users revisit and amend earlier answers, with optional snapshot/rollback of changes.", "tags": ["editing", "journey", "plugins"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://github.com/dwp/govuk-casa/blob/main/src/core-plugins/edit-snapshot/readme.md", "group": "concepts", "reserved": false, "body": "\n**Edit mode** lets a user go back and change answers they have already given.\nDuring the [request lifecycle](/concepts/request-lifecycle.md), the data\nmiddleware exposes `req.casa.editMode` and `req.casa.editOrigin` (the URL to\nreturn the user to once editing finishes). Changing an answer can reshape the\nonward journey — see how the [Plan](/concepts/plan.md) re-traverses after edits.\n\n# Edit snapshots core plugin\n\nThe `editSnapshot` [core plugin](/concepts/plugins.md) alters the behaviour of\n\"cancel\" links during an editing workflow:\n\n```javascript\nimport { configure, corePlugins } from \"@dwp/govuk-casa\";\n\nconfigure({\n  plugins: [corePlugins.editSnapshot()],\n});\n```\n\nWith it enabled, clicking \"cancel\" — or navigating away so the `edit` URL\nparameter is removed — drops all changes made during the current editing session\nand restores the [Journey Context](/concepts/journey-context.md) to its state\njust before editing began.\n\n# Related\n\n* [Configuring error visibility](https://github.com/dwp/govuk-casa/blob/main/docs/guides/error-visibility.md)\n* [Edit mode guide](https://github.com/dwp/govuk-casa/blob/main/docs/guides/edit-mode.md)\n\n# Citations\n\n[1] [Edit snapshots plugin](https://github.com/dwp/govuk-casa/blob/main/src/core-plugins/edit-snapshot/readme.md)\n"}, "concepts/events.md": {"id": "concepts/events.md", "type": "Extension Point", "title": "Events", "description": "Synchronous listeners that fire when the Journey Context is persisted to the session.", "tags": ["extension", "state", "events"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "", "group": "concepts", "reserved": false, "body": "\n**Events** fire whenever changes to the [Journey Context](/concepts/journey-context.md)\nare persisted via `JourneyContext.putContext()`. Unlike [Hooks](/concepts/hooks.md),\nthey are guaranteed to run at the point of saving, so they catch changes made\nanywhere — plugins, hooks, or your own code.\n\n\u003e Event listeners **must be synchronous.** They may fire multiple times per\n\u003e request lifecycle and are not suitable for async work.\n\n# Event types\n\n| Event             | Fires when…                                                                |\n| ----------------- | -------------------------------------------------------------------------- |\n| `waypoint-change` | Data changed on a waypoint (optionally filtered to a specific field). Only fires when data actually changes; no event if no prior data existed. |\n| `context-change`  | The whole context was persisted, after all `waypoint-change` events. Fires on *every* save. |\n\n# Registering listeners\n\n```javascript\nconfigure({\n  events: [\n    {\n      event: \"waypoint-change\",\n      waypoint: \"contact-details\",\n      field: \"tel\",\n      handler: ({ journeyContext, previousContext, session, userInfo }) =\u003e {\n        // Fires when `tel` changes on `contact-details`\n      },\n    },\n    {\n      event: \"context-change\",\n      handler: ({ journeyContext, previousContext, session, userInfo }) =\u003e {\n        // Fires on every persisted change\n      },\n    },\n  ],\n});\n```\n\nHandler arguments: `journeyContext` (updated), `previousContext` (snapshot at\nrequest start), `session`, and `userInfo`. For events fired during the\n[request lifecycle](/concepts/request-lifecycle.md), `userInfo.casaRequestPhase`\nidentifies the phase (see the `REQUEST_PHASE_*`\n[constants](https://github.com/dwp/govuk-casa/blob/main/src/lib/constants.js)).\n\n# Common use cases\n\n* **Force a re-read** — invalidate a downstream page when an answer changes its\n  meaning: `journeyContext.removeValidationForPage(\"do-you-pay-rent\")`.\n* **Purge inaccessible data** — on `context-change`, traverse the\n  [Plan](/concepts/plan.md) and `purge()` waypoints no longer reachable (guard\n  against transitional states using the request phase).\n\n# Citations\n\n[1] [Journey Context events](https://github.com/dwp/govuk-casa/blob/main/docs/events.md)\n"}, "concepts/field.md": {"id": "concepts/field.md", "type": "Concept", "title": "Field", "description": "A single form input on a page, with optional processors, conditions, and validators.", "tags": ["fields", "forms", "validation", "core"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://github.com/dwp/govuk-casa/blob/main/src/lib/field.js", "group": "concepts", "reserved": false, "body": "\nA **Field** describes an input you intend to gather from an HTML form. The\n`field()` helper returns a `PageField` instance that you attach to a\n[Page](/concepts/page.md).\n\n```javascript\nimport { field } from \"@dwp/govuk-casa\";\n\n// Most basic: just a name\nfield(\"name\");\n\n// \"Complex\" names to a depth of one property -\u003e { address: { postcode: \"\" } }\nfield(\"address[postcode]\");\n\n// Optional field\nfield(\"name\", { optional: true });\n\n// Attach validators (see Validation)\nfield(\"name\").validators([validator1, validator2]);\n\n// Restrict validation to certain conditions\nfield(\"name\").validators([validator1]).conditions([condition1]);\n\n// Transform the value before validation\nfield(\"name\").processors([processor1]);\n```\n\n# Processors\n\nProcessors run on the user input (in declaration order) **before** the value is\ngathered into the session:\n\n```javascript\nfield(\"my-field\").processors([(value) =\u003e `${value}-processed`]);\n```\n\n# Conditional validation\n\nSkip validation when a field isn't relevant — for example a\nconditionally-revealed input that was never submitted:\n\n```javascript\nfield(\"name\")\n  .validators([someValidator])\n  .conditions([\n    ({ fieldName, fieldValue, waypoint, journeyContext }) =\u003e true,\n  ]);\n```\n\n# Related\n\nFields are validated by the [Validation](/concepts/validation.md) system, which\nprovides ten built-in rules and a base class for custom ones. Gathered field\nvalues land in the [Journey Context](/concepts/journey-context.md).\n\n# Citations\n\n[1] [Fields and validation](https://github.com/dwp/govuk-casa/blob/main/docs/fields.md)\n"}, "concepts/hooks.md": {"id": "concepts/hooks.md", "type": "Extension Point", "title": "Hooks", "description": "Insert ExpressJS middleware at named points on CASA's core routers and the request lifecycle.", "tags": ["extension", "middleware", "lifecycle"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "", "group": "concepts", "reserved": false, "body": "\n**Hooks** let you insert ExpressJS middleware at defined points on CASA's core\nrouters. They are mounted at boot time (no runtime checks) and named\n`\u003cscope\u003e.\u003chook\u003e`, where scope is one of CASA's\n[routers](/concepts/routers-and-middleware.md): `static`, `ancillary`, or\n`journey`.\n\n```javascript\nconfigure({\n  hooks: [\n    {\n      hook: \"journey.prerender\",\n      middleware: (req, res, next) =\u003e {\n        console.log(`About to render ${req.path}`);\n        next();\n      },\n      // Optional: restrict to matching routes\n      // path: \"/some-waypoint\",\n    },\n  ],\n});\n```\n\n# Page-specific hooks\n\nA [Page](/concepts/page.md) definition may carry its own `hooks` (without the\n`\u003cscope\u003e.` prefix), a convenient shorthand for per-page hooks. Page hooks always\nrun **after** global hooks.\n\n# Hooks reference\n\n| Hook                                           | Runs…                                                                 |\n| ---------------------------------------------- | --------------------------------------------------------------------- |\n| `journey.presteer` / `journey.poststeer`       | Before & after the \"no jumping ahead in the Plan\" logic.              |\n| `journey.presanitise` / `journey.postsanitise` | Before & after `req.body` is cleaned for ingestion.                   |\n| `journey.pregather` / `journey.postgather`     | Before & after data is gathered into the journey context and saved.   |\n| `journey.prevalidate` / `journey.postvalidate` | Before & after validation. On failure, `req.casa.validationErrors` is present to `postvalidate`. |\n| `journey.preredirect`                          | Before the user is redirected to the next waypoint.                   |\n| `journey.prerender`                            | Before a waypoint's page is rendered.                                 |\n\nSee the [request lifecycle](/concepts/request-lifecycle.md) for exactly when\neach hook fires.\n\n# Hooks vs Events\n\nHooks bind to the HTTP request flow on specific routers. To react to journey\n*data* changes wherever they happen (including in plugins and other hooks),\nprefer [Events](/concepts/events.md), which fire at the point\n`JourneyContext.putContext()` is called.\n\n# Citations\n\n[1] [Hooks](https://github.com/dwp/govuk-casa/blob/main/docs/hooks.md)\n"}, "concepts/i18n.md": {"id": "concepts/i18n.md", "type": "Subsystem", "title": "Internationalisation", "description": "Multi-language support via i18next, using JSON/YAML dictionary files organised by locale and namespace.", "tags": ["i18n", "localisation", "translations", "i18next"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://github.com/dwp/govuk-casa/blob/main/src/middleware/i18n.js", "group": "concepts", "reserved": false, "body": "\nCASA performs translations through dictionary files using the\n[i18next](/references/i18next.md) library. On each request a `req.t()` function\nis available in code, and a `t()` function is available in\n[templates](/concepts/templating.md). Configure it through `i18n.dirs` and\n`i18n.locales` in [`configure()`](/concepts/configure.md).\n\n# Dictionary structure\n\nDictionaries live under one or more folders, each organised by locale then\nfile. Every file is a **namespace** and its entries are **keys**. YAML is\nrecommended over JSON for brevity and multiline support.\n\n```text\n/my-folder\n  /en\n    welcome.yaml\n  /cy\n    welcome.yaml\n```\n\n```yaml\n# welcome.yaml\npage_title: Hello, {{ salutation }}!\nfields:\n  name:\n    label: What's your name?\n```\n\n# Using translations\n\n```jinja\n\u003ch1\u003e{{ t('welcome:page_title', { salutation: 'World' }) }}\u003c/h1\u003e\n\u003cp class=\"govuk-body\"\u003e{{ t('welcome:fields.name.label') }}\u003c/p\u003e\n```\n\nThis also shows i18next string interpolation (`{{ salutation }}`). The detected\nlanguage is stored in `session.language` and surfaced to templates as\n`htmlLang`/`locale` by the data middleware (see the\n[request lifecycle](/concepts/request-lifecycle.md)).\n\n# Related\n\nValidator [error messages](/concepts/validation.md) are typically i18n keys such\nas `waypoint:field.name.error`.\n\n# Citations\n\n[1] [Internationalisation](https://github.com/dwp/govuk-casa/blob/main/docs/i18n.md)\n"}, "concepts/index.md": {"id": "concepts/index.md", "type": "Index", "title": "Concepts — Index", "description": "Directory listing for concepts.", "tags": [], "timestamp": "", "resource": "", "group": "concepts", "reserved": true, "body": "# Core concepts\n\n* [CASA Framework](casa-framework.md) - Top-level overview of what CASA is and how its pieces fit together.\n* [configure()](configure.md) - The single entrypoint that wires up all routers, middleware, and the mount function.\n* [mount()](mount.md) - Seals configuration and mounts CASA onto an ExpressJS app.\n\n# The journey model\n\n* [The Plan](plan.md) - Directed-graph blueprint of every journey a user can take.\n* [Waypoint](waypoint.md) - A visitable node in the Plan graph.\n* [Route](route.md) - A conditional edge connecting two waypoints.\n* [Journey Context](journey-context.md) - The per-user state (data + validation) of a journey.\n\n# Pages, fields & validation\n\n* [Page](page.md) - The concrete, interactive form that renders a waypoint.\n* [Field](field.md) - A single form input, its processors and validators.\n* [Validation](validation.md) - The validator system and the ten built-in rules.\n\n# Extension points\n\n* [Hooks](hooks.md) - Insert middleware at named points in the request lifecycle.\n* [Events](events.md) - React synchronously to Journey Context changes.\n* [Plugins](plugins.md) - Bundle config/bootstrap/template changes into reusable units.\n* [Edit mode](edit-mode.md) - Let users revisit and amend earlier answers.\n\n# Request flow & rendering\n\n* [Request lifecycle](request-lifecycle.md) - Ordered passage of a request through CASA's stages.\n* [Routers & middleware](routers-and-middleware.md) - The artifacts `configure()` returns and their mount order.\n* [Templating](templating.md) - Nunjucks layouts, blocks, macros, and error pages.\n* [Internationalisation](i18n.md) - Multi-language dictionaries via i18next.\n"}, "concepts/journey-context.md": {"id": "concepts/journey-context.md", "type": "Concept", "title": "Journey Context", "description": "The per-user state — captured data plus validation results — of a journey through a Plan.", "tags": ["state", "session", "journey", "core"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://github.com/dwp/govuk-casa/blob/main/src/lib/JourneyContext.js", "group": "concepts", "reserved": false, "body": "\nThe **Journey Context** is the \"state\" of a user's journey through a\n[Plan](/concepts/plan.md). As the user moves through waypoints it captures two\nthings:\n\n* The **data** gathered for each waypoint.\n* The **validation** results for that data.\n\nState is stored as a plain JavaScript object in the server session, and exposed\non requests as `req.casa.journeyContext` (see the\n[request lifecycle](/concepts/request-lifecycle.md)).\n\n# Ephemeral contexts\n\nMost setups use a single context per user, but multiple **ephemeral contexts**\ncan be stored — useful for temporary, parallel state. Differentiate them by\nidentity:\n\n```javascript\noneContext.identity.name = \"some-unique-name\";\nanotherContext.identity.tags = [\"some-tag\"];\n```\n\nThe active context is chosen by a `contextid` request parameter, which CASA\nlooks for (in order) in `req.params`, `req.query`, then `req.body`. With none\nsupplied, the default context is used.\n\n# Working with contexts\n\n`JourneyContext` exposes static get/set/remove helpers:\n\n```javascript\nJourneyContext.getDefaultContext(req.session);\nJourneyContext.getContexts(req.session);\nJourneyContext.getContextById(req.session, \"some-id\");\nJourneyContext.getContextByName(req.session, \"some-name\");\nJourneyContext.getContextsByTag(req.session, \"some-tag\");\n\n// Persisting changes — this is what triggers Events\nJourneyContext.putContext(req.session, myJourneyContext);\n\nJourneyContext.removeContext(req.session, myJourneyContext);\nJourneyContext.createEphemeralContext(req);\n```\n\nContexts serialise with `toObject()` and rebuild with\n`JourneyContext.fromObject()`.\n\n# Custom context IDs\n\nEphemeral contexts default to UUID IDs, which don't meet GOV.UK URL standards.\nSupply a synchronous `contextIdGenerator` to [`configure()`](/concepts/configure.md),\nor use a bundled generator (`uuid()`, `shortGuid()`, `sequentialInteger()`). A\ngenerated ID must be a 1–64 char string of `a-z`, `0-9`, `-`.\n\n# Related\n\nPersisting a context with `putContext()` fires [Events](/concepts/events.md).\nMethods like `removeValidationForPage()` and `purge()` let event handlers force\nre-validation or clear inaccessible data.\n\n# Citations\n\n[1] [The Journey Context](https://github.com/dwp/govuk-casa/blob/main/docs/journey-context.md)\n"}, "concepts/mount.md": {"id": "concepts/mount.md", "type": "API Function", "title": "mount()", "description": "Seals CASA configuration and mounts all routers and middleware onto an ExpressJS app.", "tags": ["api", "setup", "express"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://github.com/dwp/govuk-casa/blob/main/src/lib/mount.js", "group": "concepts", "reserved": false, "body": "\n`mount()` is returned by [`configure()`](/concepts/configure.md). Calling it\nmounts all CASA routers and middleware onto the supplied ExpressJS app and\neffectively prevents any further modification of those artifacts. Call it last,\nonce routers and middleware are set up as you wish.\n\n```javascript\nconst { mount } = configure({ /* ... */ });\nconst app = express();\n\napp.use(\"/\", mount(express()));\n```\n\n# Options\n\n| Option               | Type      | Description                                                                 |\n| -------------------- | --------- | --------------------------------------------------------------------------- |\n| `route`              | `string`  | Mount under a [parameterised route](https://github.com/dwp/govuk-casa/blob/main/docs/guides/parameterised-mount.md), e.g. `/:id`. |\n| `serveFirstWaypoint` | `boolean` | Serve the first [waypoint](/concepts/waypoint.md) of the [Plan](/concepts/plan.md) when `/` is visited. |\n\n# Auto-serving the first waypoint\n\nBy default CASA does **not** serve the first waypoint at the mount root, so a\nvisit to `/` yields a 404. Pass `serveFirstWaypoint: true` to redirect users to\nthe first waypoint instead:\n\n```javascript\napp.use(\"/\", mount(express(), { serveFirstWaypoint: true }));\n```\n\n# Citations\n\n[1] [The mount() function](https://github.com/dwp/govuk-casa/blob/main/docs/mount-function.md)\n"}, "concepts/page.md": {"id": "concepts/page.md", "type": "Concept", "title": "Page", "description": "The concrete, interactive form that renders a single waypoint.", "tags": ["pages", "forms", "rendering", "core"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "", "group": "concepts", "reserved": false, "body": "\nA **Page** is the tangible representation of a [Waypoint](/concepts/waypoint.md):\nyou *visit* waypoints during a journey, but you *interact* with the form on a\npage. Not every waypoint needs a page — you can write custom routes for a\nwaypoint and attach them to the journey router yourself.\n\n# Page definition\n\n```javascript\n{\n  // The waypoint this page represents\n  waypoint: \"details\",\n\n  // The Nunjucks template that renders this page\n  view: \"pages/details.njk\",\n\n  // Hooks that run only on requests to this page\n  hooks: [{ /* ... */ }],\n\n  // Definitions for the fields on this page's form\n  fields: [{ /* ... */ }],\n}\n```\n\nPages are passed to [`configure()`](/concepts/configure.md) via the `pages`\narray:\n\n```javascript\nconfigure({\n  pages: [{\n    waypoint: \"details\",\n    view: \"pages/details.njk\",\n    fields: [field(\"firstField\"), field(\"secondField\")],\n  }],\n});\n```\n\n# Composition\n\n| Part      | See                                            |\n| --------- | ---------------------------------------------- |\n| `waypoint`| [Waypoint](/concepts/waypoint.md)              |\n| `view`    | [Templating](/concepts/templating.md)          |\n| `hooks`   | [Hooks](/concepts/hooks.md) (page-specific)    |\n| `fields`  | [Field](/concepts/field.md)                    |\n\n# Citations\n\n[1] [Pages](https://github.com/dwp/govuk-casa/blob/main/docs/pages.md)\n"}, "concepts/plan.md": {"id": "concepts/plan.md", "type": "Concept", "title": "The Plan", "description": "A directed-graph blueprint of every journey a user might take through a service.", "tags": ["journey", "routing", "graph", "core"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://github.com/dwp/govuk-casa/blob/main/src/lib/Plan.js", "group": "concepts", "reserved": false, "body": "\nA **Plan** is a blueprint describing all possible journeys a user might take\nthrough your service. The simplest Plan is linear (one page after another);\nricher Plans branch off on tangents depending on the data the user provides.\nInternally it is a directed graph: [Waypoints](/concepts/waypoint.md) are nodes\nand [Routes](/concepts/route.md) are edges.\n\nIt is recommended to define the Plan in its own file, wrapped in a function so\nconfiguration can be injected at runtime, and pass it into\n[`configure()`](/concepts/configure.md).\n\n```javascript\nimport { Plan } from \"@dwp/govuk-casa\";\n\nexport default function () {\n  const plan = new Plan();\n  plan.addSequence(\"personal-details\", \"contact\", \"check-your-answers\");\n  return plan;\n}\n```\n\n# Terminology\n\n| Term            | Meaning                                                                |\n| --------------- | ---------------------------------------------------------------------- |\n| Plan            | The sum of all waypoints and routes.                                   |\n| Waypoint        | A visitable point in the journey (graph node).                         |\n| Route           | A connection between two waypoints (graph edge); one-way or two-way.   |\n| Condition       | A boolean decision of whether a route is followed during traversal.    |\n| Journey Context | State (data + validation) of the user's interaction with the Plan.     |\n\n# Defining routes\n\n```javascript\nconst plan = new Plan();\n\n// Two-way route: creates both a `next` and a `prev` route\nplan.setRoute(\"a\", \"b\");\n\n// Convenience: a sequence of two-way routes\nplan.addSequence(\"a\", \"b\", \"c\", \"d\");\n\n// One-way routes\nplan.setNextRoute(\"b\", \"c\");\nplan.setPrevRoute(\"c\", \"a\");\n```\n\n# Route conditions\n\nBy default a route is only traversed if its **source** waypoint has been\nsuccessfully validated. You can override this with a condition function\n`(route, context) =\u003e boolean`:\n\n```javascript\nplan.setRoute(\"a\", \"b\", (r, c) =\u003e c.data.a.ticked === true);\nplan.setRoute(\"a\", \"c\", (r, c) =\u003e c.data.a.ticked !== true);\n```\n\nSet `new Plan({ validateBeforeRouteCondition: false })` to skip CASA's built-in\nsource-validation check before your condition runs. See\n[Route](/concepts/route.md) for edge labelling and arbitration.\n\n# Skippable waypoints\n\nMark waypoints the user may actively skip, then send them to a `?skipto=...`\nURL:\n\n```javascript\nplan.addSkippables(\"details\", \"info\", \"another\");\n```\n\n# Re-traversal after edits\n\nWhen a user changes earlier answers, CASA snapshots the journey before and\nafter submission and compares them to decide where to send the user next (stop\nat a newly inserted waypoint, or the last incomplete waypoint when one is\nremoved). This underpins [Edit mode](/concepts/edit-mode.md).\n\n# Visualising\n\n`plan.getGraphStructure()` returns the raw directed graph, which can be\nserialised (e.g. to Graphviz DOT) for visualisation. Edges are labelled with the\nname of their routing function.\n\n# Citations\n\n[1] [The Plan](https://github.com/dwp/govuk-casa/blob/main/docs/plan.md)\n"}, "concepts/plugins.md": {"id": "concepts/plugins.md", "type": "Extension Mechanism", "title": "Plugins", "description": "Reusable units that manipulate CASA configuration, routers/middleware, and Nunjucks templates.", "tags": ["extension", "plugins", "templating"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://github.com/dwp/govuk-casa/tree/main/src/core-plugins", "group": "concepts", "reserved": false, "body": "\nA **plugin** packages up changes to a CASA app — configuration tweaks, extra\nroutes, and template modifications — into a reusable unit. Load plugins via the\n`plugins` array of [`configure()`](/concepts/configure.md):\n\n```javascript\nimport somePlugin from \"somewhere\";\n\nconfigure({\n  plugins: [somePlugin()],\n});\n```\n\n# Lifecycle phases\n\nA plugin establishes itself in two phases:\n\n* **Configure** — an optional `configure(config)` method that mutates the raw\n  configuration (e.g. appending template directories):\n\n  ```javascript\n  function configure(config) {\n    config.views.push(\"path/to/my/views\");\n  }\n  ```\n\n* **Bootstrap** — an optional `bootstrap(artifacts)` method that manipulates\n  CASA's created [routers, middleware](/concepts/routers-and-middleware.md), and\n  Nunjucks environment after core setup:\n\n  ```javascript\n  function bootstrap({ ancillaryRouter }) {\n    ancillaryRouter.get(\"/info\", (req, res) =\u003e res.render(\"info.njk\"));\n  }\n  ```\n\n# Injecting template content\n\nPlugins manipulate templates through CASA's specialised Nunjucks loader. The\nsupported `modifyBlock()` mechanism inserts content into a named block:\n\n```javascript\nfunction bootstrap({ nunjucksEnv }) {\n  nunjucksEnv.modifyBlock(\"blockName\", () =\u003e\n    'Injected: {% include \"my-plugin/thing.njk\" %}',\n  );\n}\n```\n\n(`modifyTemplate()` is documented but **not yet implemented**.) By convention a\nplugin should also offer a `disableContentModification` option so developers can\ninject content manually where automatic insertion isn't precise enough. Plugins\nshould support both ESM and CommonJS consumers.\n\n# Core plugins\n\nCASA ships internal plugins under `corePlugins`, including\n[Edit snapshots](/concepts/edit-mode.md):\n\n```javascript\nimport { configure, corePlugins } from \"@dwp/govuk-casa\";\n\nconfigure({ plugins: [corePlugins.editSnapshot()] });\n```\n\n# Citations\n\n[1] [Plugins](https://github.com/dwp/govuk-casa/blob/main/docs/plugins.md)\n[2] [Core plugins](https://github.com/dwp/govuk-casa/blob/main/src/core-plugins/readme.md)\n"}, "concepts/request-lifecycle.md": {"id": "concepts/request-lifecycle.md", "type": "Process", "title": "Request lifecycle", "description": "The ordered passage of a request through CASA's routers and middleware, and the data each stage adds.", "tags": ["lifecycle", "middleware", "request", "core"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://github.com/dwp/govuk-casa/blob/main/docs/request-lifecycle.md", "group": "concepts", "reserved": false, "body": "\nAs a request passes through CASA's routers and\n[middleware](/concepts/routers-and-middleware.md), each stage augments `req` and\n`res.locals` (the latter feeds Nunjucks templates). The stages run in this\norder.\n\n# Stage order\n\n| Stage                  | Responsibility                                                                 | Key additions                                                  |\n| ---------------------- | ------------------------------------------------------------------------------ | -------------------------------------------------------------- |\n| **preMiddleware**      | No-cache headers, CSP nonce, Helmet headers.                                    | `res.locals.cspNonce`                                          |\n| **staticRouter**       | Serve `/govuk/assets/` and `/casa/assets/` resources.                          | —                                                              |\n| **sessionMiddleware**  | Initialise/load session; cookie parsing; session-expiry redirects.             | `req.session`, `req.signedCookies`                             |\n| **i18nMiddleware**     | Detect language; attach i18next translator.                                    | `req.t()`, `req.language`, `session.language`                  |\n| **bodyParserMiddleware** | Parse and verify the request body.                                           | `req.body`                                                     |\n| **dataMiddleware**     | Attach plan, journey context, edit flags; template helpers.                    | `req.casa.plan`, `req.casa.journeyContext`, `waypointUrl()`    |\n| **ancillaryRouter**    | Mount generic pages such as `/session-timeout`.                                | —                                                              |\n| **journeyRouter**      | The interactive waypoint flow (see below).                                     | `req.casa.waypoint`, `res.locals.casa.csrfToken`              |\n| **postMiddleware**     | 404 handling and 4xx/5xx error responses.                                      | —                                                              |\n\n# Inside the journey router (POST)\n\nFor form submissions the journey router runs, in order: set CSRF token → set\ncurrent waypoint → handle `skipto` → **presteer** hooks → \"no jumping ahead\"\ncheck → **poststeer** → **presanitise** → sanitise/prune `req.body` and run\nfield [processors](/concepts/field.md) → **postsanitise** → **pregather** →\ngather data into `req.casa.journeyContext` (snapshots\n`req.casa.archivedJourneyContext`) → **postgather** → **prevalidate** →\n[validate](/concepts/validation.md) → **postvalidate** → **preredirect** (if\nvalid) → compute next waypoint and redirect → **prerender** → render the form.\nThe bracketed names are [Hooks](/concepts/hooks.md).\n\n# Always-present additions\n\n* `req.unparameterisedBaseUrl` — `req.baseUrl` with parameterised segments\n  removed (used to serve static assets from a non-parameterised path).\n* Template globals: `casaVersion`, `mergeObjects()`, `includes()`,\n  `formatDateObject()`, `renderAsAttributes()`, `waypointUrl()` (see\n  [Templating](/concepts/templating.md)).\n\n# Citations\n\n[1] [Request lifecycle](https://github.com/dwp/govuk-casa/blob/main/docs/request-lifecycle.md)\n"}, "concepts/route.md": {"id": "concepts/route.md", "type": "Concept", "title": "Route", "description": "A conditional, directed edge between two waypoints in a Plan.", "tags": ["journey", "routing", "graph", "core"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://github.com/dwp/govuk-casa/blob/main/src/lib/Plan.js", "group": "concepts", "reserved": false, "body": "\nA **Route** is a connection between two [Waypoints](/concepts/waypoint.md) in a\n[Plan](/concepts/plan.md) — the *edge* in the directed graph. Routes can be\ntwo-way or one-way, and each carries a **condition** that decides whether it is\nfollowed during a traversal.\n\n# Creating routes\n\n```javascript\n// Two-way: creates a `next` and a `prev` route between a and b\nplan.setRoute(\"a\", \"b\");\n\n// One-way routes\nplan.setNextRoute(\"b\", \"c\");\nplan.setPrevRoute(\"c\", \"a\");\n\n// A run of two-way routes\nplan.addSequence(\"a\", \"b\", \"c\", \"d\", \"e\");\n```\n\n# Conditions\n\nEvery route has a condition. By default it requires the **source** waypoint to\nhave passed validation. Provide your own to branch on journey data:\n\n```javascript\n/**\n * @param {object} route   Information about the route being traversed\n * @param {JourneyContext} context  Contextual state information\n * @returns {boolean} Whether the route should be followed\n */\nconst goNorth = (r, c) =\u003e c.data.start.direction === \"north\";\nplan.setRoute(\"start\", \"forest\", goNorth);\n```\n\nCASA still runs its own source-validation check before your condition, unless\n`validateBeforeRouteCondition: false` is set on the Plan.\n\n# Edge labels\n\nRoutes are labelled in graph output by the **name of their condition\nfunction**. Named and arrow functions assigned to a variable take that name;\nanonymous functions are blank. Higher-order functions can assign dynamic names\nto produce descriptive labels such as `start \u003c-- \"direction\" equals \"west\" --\u003e field`.\n\n# Arbitration\n\nWhen CASA cannot decide between competing routes, configure an\n[arbitration process](https://github.com/dwp/govuk-casa/blob/main/docs/guides/handling-stale-data.md)\nto nudge traversal in the right direction.\n\n# Citations\n\n[1] [The Plan — route conditions](https://github.com/dwp/govuk-casa/blob/main/docs/plan.md)\n"}, "concepts/routers-and-middleware.md": {"id": "concepts/routers-and-middleware.md", "type": "Architecture", "title": "Routers & middleware", "description": "The mutable ExpressJS routers and middleware arrays that configure() returns, and their mount order.", "tags": ["express", "routers", "middleware", "architecture"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://github.com/dwp/govuk-casa/tree/main/src/middleware", "group": "concepts", "reserved": false, "body": "\n[`configure()`](/concepts/configure.md) returns a set of ExpressJS routers and\nmiddleware arrays. All are **mutable** before [`mount()`](/concepts/mount.md) is\ncalled (you can `push()`/`unshift()` your own middleware, or append routes) and\n**immutable** afterwards. They mount in the order listed below.\n\n```javascript\nconst {\n  staticRouter, ancillaryRouter, journeyRouter,\n  preMiddleware, sessionMiddleware, i18nMiddleware,\n  bodyParserMiddleware, dataMiddleware, postMiddleware,\n  csrfMiddleware, cookieParserMiddleware,\n  mount,\n} = configure({ /* ... */ });\n```\n\n# Routers\n\n| Router            | Type                        | Serves                                              |\n| ----------------- | --------------------------- | --------------------------------------------------- |\n| `staticRouter`    | `MutableRouter` or `Router` | Static assets: CSS, JS, images, fonts.              |\n| `ancillaryRouter` | `MutableRouter` or `Router` | General-purpose pages (e.g. `session-timeout`).     |\n| `journeyRouter`   | `MutableRouter` or `Router` | Every interactive [waypoint](/concepts/waypoint.md) page. |\n\nThese are the three scopes available to [Hooks](/concepts/hooks.md): `static`,\n`ancillary`, `journey`. Mutability is provided by\n[`MutableRouter`](https://github.com/dwp/govuk-casa/blob/main/src/lib/MutableRouter.js)\n— see the [mutable routers guide](https://github.com/dwp/govuk-casa/blob/main/docs/guides/mutable-routers.md).\n\n# Middleware (mount order)\n\n| Middleware               | Role                                                                  |\n| ------------------------ | --------------------------------------------------------------------- |\n| `preMiddleware`          | Runs first; generally security related.                               |\n| `sessionMiddleware`      | Initialises or loads session data.                                    |\n| `i18nMiddleware`         | Initialises [i18n](/concepts/i18n.md) on the request.                 |\n| `bodyParserMiddleware`   | Parses url-encoded bodies into `req.body`.                            |\n| `dataMiddleware`         | Adds properties to `req` and `res.locals`.                            |\n| `postMiddleware`         | Runs last; 404 and 4xx/5xx error handlers.                            |\n| `csrfMiddleware`         | CSRF token get/set/verify for POST forms.                            |\n| `cookieParserMiddleware` | Parses cookies into `req.signedCookies`.                             |\n\nSee the [request lifecycle](/concepts/request-lifecycle.md) for what each stage\ncontributes to `req` and `res.locals`.\n\n# Citations\n\n[1] [Setting up — returned values](https://github.com/dwp/govuk-casa/blob/main/docs/setup.md)\n[2] [Mutable routers](https://github.com/dwp/govuk-casa/blob/main/docs/guides/mutable-routers.md)\n"}, "concepts/templating.md": {"id": "concepts/templating.md", "type": "Subsystem", "title": "Templating", "description": "Nunjucks layouts, CASA-specific blocks, form-component macros, and overridable error pages.", "tags": ["templating", "nunjucks", "rendering", "views"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://github.com/dwp/govuk-casa/blob/main/src/lib/nunjucks.js", "group": "concepts", "reserved": false, "body": "\nCASA renders [Pages](/concepts/page.md) with **Nunjucks**. When resolving a\ntemplate it searches these directories in order, using the first match: your\n`views` directories (from [`configure()`](/concepts/configure.md)) → CASA's\ninternal `views/` → the [`govuk-frontend`](/references/govuk-frontend.md) module\n→ plugin templates.\n\n# Layouts\n\n| Layout                     | Use for                                            |\n| -------------------------- | -------------------------------------------------- |\n| `casa/layouts/main.njk`    | General-purpose pages.                             |\n| `casa/layouts/journey.njk` | Waypoint page forms that feature in your Plan.     |\n\nOverride or extend these by defining your own `casa/layouts/*.njk` in a view\ndirectory.\n\n# CASA blocks\n\n| Block           | Purpose                                                                |\n| --------------- | ---------------------------------------------------------------------- |\n| `casaPageTitle` | Sets the page title (the `journey.njk` layout auto-adds an \"Error: \" prefix). |\n| `journey_form`  | Where the body of your HTML form goes (journey layout only).          |\n\n# Form component macros\n\nBuild forms with macros from `casa/components/*` (bundled CASA macros) or\n`govuk/components/*` (GOV.UK Design System). The CASA macros wrap the GOV.UK\nones with the same interface, plus convenient parameters that decorate inputs\nwith error state and analytics attributes (`casaErrors`, `casaValue`,\n`casaWithAnalytics`).\n\n```jinja\n{% extends \"casa/layouts/journey.njk\" %}\n{% from \"casa/components/radios/macro.njk\" import casaGovukRadios with context %}\n\n{% block journey_form %}\n  {{ casaGovukRadios({\n    name: \"ready\",\n    items: [ /* ... */ ],\n    casaValue: formData.ready,\n    casaErrors: formErrors\n  }) }}\n{% endblock %}\n```\n\n# Template helpers\n\nAvailable globals/filters include `waypointUrl()` (pre-curried with `mountUrl`,\n`journeyContext`, `edit`, `editOrigin`), `mergeObjects()`, `includes()`,\n`formatDateObject()`, and `renderAsAttributes()`. See the\n[request lifecycle](/concepts/request-lifecycle.md) for the full set.\n\n# Error pages\n\nOverridable templates: `casa/errors/404.njk`, `403.njk` (invalid CSRF / body\nverification), `500.njk`, `503.njk` (upstream failure), and `static.njk` (a\ntranslation-free fallback). `errorCode` values are listed in the\n[error handler](https://github.com/dwp/govuk-casa/blob/main/src/middleware/post.js).\n\n# Citations\n\n[1] [Templating](https://github.com/dwp/govuk-casa/blob/main/docs/templating.md)\n"}, "concepts/validation.md": {"id": "concepts/validation.md", "type": "Subsystem", "title": "Validation", "description": "The validator system — ten built-in rules plus a ValidatorFactory base class for custom rules.", "tags": ["validation", "fields", "forms", "core"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://github.com/dwp/govuk-casa/tree/main/src/lib/validators", "group": "concepts", "reserved": false, "body": "\nCASA validates [Field](/concepts/field.md) values using **validators**. Each\nvalidator is created with `.make(config)` and attached to a field via\n`.validators([...])`. Validation runs during the\n[request lifecycle](/concepts/request-lifecycle.md) and records results in the\n[Journey Context](/concepts/journey-context.md).\n\n```javascript\nimport { validators, field } from \"@dwp/govuk-casa\";\n\nfield(\"name\").validators([\n  validators.required.make({ errorMsg: \"name:field.error\" }),\n  validators.strlen.make({ max: 100 }),\n]);\n```\n\n# Built-in validators\n\n| Validator             | Purpose                                                                 |\n| --------------------- | ----------------------------------------------------------------------- |\n| `required`            | Field must provide a non-empty value.                                   |\n| `strlen`              | String length within a min/max number of characters.                    |\n| `wordCount`           | String within a min/max number of words.                                |\n| `range`               | Integer within a numerical min/max range (integers only).               |\n| `regex`               | Value matches (or doesn't match) a regular expression.                  |\n| `email`               | Value is a validly formatted email address.                             |\n| `inArray`             | Value occurs within a predefined array of options.                      |\n| `nino`                | Value is a UK National Insurance number (case-insensitive).             |\n| `dateObject`          | Validates day/month/year input from the `casaGovukDateInput()` macro (via Luxon). |\n| `postalAddressObject` | Validates multi-field UK postal addresses from the postal-address macro. |\n\n# Writing custom validators\n\nCustom validators extend [`ValidatorFactory`](https://github.com/dwp/govuk-casa/blob/main/src/lib/ValidatorFactory.js):\n\n```javascript\nimport { ValidatorFactory, ValidationError } from \"@dwp/govuk-casa\";\n\nclass MyValidator extends ValidatorFactory {\n  name = \"myvalidator\";\n\n  // Optional: transform a value before validation\n  sanitise(value) {\n    return value;\n  }\n\n  // Required: return an array of errors (empty = valid)\n  validate(value, dataContext) {\n    return [ValidationError.make({ errorMsg, dataContext })];\n  }\n}\n\nfield(\"name\").validators([MyValidator.make()]);\n```\n\n\u003e **Gotcha:** if `sanitise()` returns a falsy value, CASA will not re-render the\n\u003e input when the user revisits the page — return transformed values as strings\n\u003e to avoid losing the offending value alongside an error message.\n\n# Error messages\n\nEvery validator accepts an `errorMsg`, which may be a string (or i18n key), an\nobject with `summary`/`variables`, or a function returning either form.\nVariables can be static (object) or dynamically evaluated (function), enabling\nruntime interpolation from the journey context.\n\n# Related\n\n* [Field](/concepts/field.md) — where validators are attached.\n* [ValidationError](https://github.com/dwp/govuk-casa/blob/main/src/lib/ValidationError.js) — the error object validators emit.\n* [Internationalisation](/concepts/i18n.md) — error messages are typically i18n keys.\n\n# Citations\n\n[1] [Fields and validation](https://github.com/dwp/govuk-casa/blob/main/docs/fields.md)\n[2] [Built-in validator rules](https://github.com/dwp/govuk-casa/tree/main/src/lib/validators)\n"}, "concepts/waypoint.md": {"id": "concepts/waypoint.md", "type": "Concept", "title": "Waypoint", "description": "A visitable node in the Plan graph, abstractly representing a point in the user's journey.", "tags": ["journey", "routing", "core"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "", "group": "concepts", "reserved": false, "body": "\nA **Waypoint** is a visitable point in a user's journey through a\n[Plan](/concepts/plan.md) — the *node* in the Plan's directed graph. Waypoints\nare abstractions; the concrete, visible web form that implements one is a\n[Page](/concepts/page.md). The terms *waypoint* and *page* are often\ninterchangeable, but a waypoint can exist without a page if you wire up custom\nroutes for it yourself.\n\n# Valid waypoint syntax\n\nWaypoints are identified by strings:\n\n* **Simple** — `personal-details`, `contact`, `contact/telephone`,\n  `check-your-answers`, `money/bank-accounts`.\n* **Sub-app URLs** — `url:///slug/to/somewhere` redirects the user to\n  `/slug/to/somewhere`. When linking to another Plan, specify that app's mount\n  URL (not a specific waypoint) and let it decide where to send the user based\n  on its own [Journey Context](/concepts/journey-context.md).\n\n\u003e A sub-app can be linked only once in a Plan. To reuse a sub-app elsewhere,\n\u003e mount a duplicate instance on a different URL.\n\n# Relationship to other concepts\n\n* A [Route](/concepts/route.md) connects two waypoints.\n* A [Page](/concepts/page.md) renders a waypoint as an interactive form.\n* `req.casa.waypoint` holds the current waypoint during the\n  [request lifecycle](/concepts/request-lifecycle.md).\n\n# Citations\n\n[1] [The Plan — valid waypoint syntax](https://github.com/dwp/govuk-casa/blob/main/docs/plan.md)\n[2] [Pages](https://github.com/dwp/govuk-casa/blob/main/docs/pages.md)\n"}, "examples/barebones.md": {"id": "examples/barebones.md", "type": "Example Application", "title": "Barebones example", "description": "A minimal CASA application demonstrating the smallest viable setup.", "tags": ["example", "getting-started"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://github.com/dwp/govuk-casa/tree/main/examples/barebones", "group": "examples", "reserved": false, "body": "\nThe **barebones** example is the smallest viable CASA application — a good\nstarting point for understanding the minimal [`configure()`](/concepts/configure.md)\n→ [`mount()`](/concepts/mount.md) setup. It contains its own `definitions/`\n(plan and pages), `views/`, `locales/`, `plugins/`, and `assets/`.\n\n# Running it\n\n```bash\n# From the framework root, link the local build\nnpm ci\nnpm link\n\n# Then run the example\ncd examples/barebones/\nnpm i\nnpm link @dwp/govuk-casa\nDEBUG=casa* PORT=3000 npm start\n```\n\nVisit \u003chttp://localhost:3000/barebones/\u003e.\n\n# See also\n\n* [Setting up a CASA app](/playbooks/setting-up-a-casa-app.md)\n* [Fully-loaded example](/examples/fully-loaded.md) — every feature exercised.\n\n# Citations\n\n[1] [Barebones example README](https://github.com/dwp/govuk-casa/blob/main/examples/barebones/README.md)\n"}, "examples/dwp-frontend.md": {"id": "examples/dwp-frontend.md", "type": "Example Application", "title": "DWP Frontend example", "description": "A barebones CASA app integrated with the @dwp/dwp-frontend design system.", "tags": ["example", "dwp-frontend", "theming"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://github.com/dwp/govuk-casa/tree/main/examples/dwp-frontend", "group": "examples", "reserved": false, "body": "\nThe **dwp-frontend** example configures CASA with the\n[`@dwp/dwp-frontend`](https://www.npmjs.com/package/@dwp/dwp-frontend) design\nsystem instead of vanilla GOV.UK styling. The same integration steps apply to\nany Express-based application.\n\n# Integration outline\n\n1. Create an SCSS entry pulling styles from `@dwp/dwp-frontend`; compile with\n   `npm run compile:sass`.\n2. Create a JS entry importing the required modules; compile with\n   `npm run compile:js`.\n3. Serve the compiled assets on a static route via the\n   [`staticRouter`](/concepts/routers-and-middleware.md).\n4. Inject the CSS/JS into your Nunjucks layouts and point\n   [`configure({ views })`](/concepts/configure.md) at the dwp-frontend views\n   folder.\n5. Use the dwp-frontend components in your [pages/layouts](/concepts/templating.md).\n\n# See also\n\n* [DWP Design System components](https://design-system.dwp.gov.uk/components)\n* [Templating](/concepts/templating.md) — how CASA resolves and overrides views.\n\n# Citations\n\n[1] [DWP Frontend example README](https://github.com/dwp/govuk-casa/blob/main/examples/dwp-frontend/README.md)\n"}, "examples/fully-loaded.md": {"id": "examples/fully-loaded.md", "type": "Example Application", "title": "Fully-loaded example", "description": "An example exercising every CASA feature; also the basis for the end-to-end test suite.", "tags": ["example", "reference", "e2e"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://github.com/dwp/govuk-casa/tree/main/examples/fully-loaded", "group": "examples", "reserved": false, "body": "\nThe **fully-loaded** example makes use of every CASA feature, making it the most\ncomplete reference application. It is also the basis for the framework's\nend-to-end test suite (`tests/e2e/`), so changes here may require corresponding\ntest changes. It includes a `sub-app/` to demonstrate composition.\n\n# Running it\n\n```bash\nnpm i\nDEBUG=casa* PORT=3000 npm start\n```\n\nVisit \u003chttp://localhost:3000/fully-loaded/\u003e.\n\n# See also\n\n* [Barebones example](/examples/barebones.md) — minimal counterpart.\n* [Multiapp example](/examples/multiapp.md) — multiple sub-apps.\n* Concepts exercised here include [Plan](/concepts/plan.md),\n  [Pages](/concepts/page.md), [Validation](/concepts/validation.md),\n  [Hooks](/concepts/hooks.md), [Events](/concepts/events.md), and\n  [Plugins](/concepts/plugins.md).\n\n# Citations\n\n[1] [Fully-loaded example README](https://github.com/dwp/govuk-casa/blob/main/examples/fully-loaded/README.md)\n"}, "examples/index.md": {"id": "examples/index.md", "type": "Index", "title": "Examples — Index", "description": "Directory listing for examples.", "tags": [], "timestamp": "", "resource": "", "group": "examples", "reserved": true, "body": "# Example applications\n\nThe four applications bundled with CASA, in increasing order of complexity.\n\n* [Barebones example](barebones.md) - The smallest viable CASA application.\n* [DWP Frontend example](dwp-frontend.md) - Barebones integrated with the @dwp/dwp-frontend design system.\n* [Multiapp example](multiapp.md) - Multiple CASA sub-apps within one parent ExpressJS application.\n* [Fully-loaded example](fully-loaded.md) - Exercises every CASA feature; basis for the e2e test suite.\n"}, "examples/multiapp.md": {"id": "examples/multiapp.md", "type": "Example Application", "title": "Multiapp example", "description": "Demonstrates running multiple CASA sub-apps within one parent ExpressJS application.", "tags": ["example", "sub-apps", "composition"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://github.com/dwp/govuk-casa/tree/main/examples/multiapp", "group": "examples", "reserved": false, "body": "\nThe **multiapp** example shows how to configure multiple CASA applications\nwithin a single parent ExpressJS app. It creates two [Plans](/concepts/plan.md)\nand intersects them so the user experiences one continuous journey:\n\n```text\n# Plan 1\nA -\u003e B -\u003e C ... F -\u003e G\n\n# Plan 2\nD -\u003e E\n\n# Combined journey as experienced by the user\nA -\u003e B -\u003e C -\u003e D -\u003e E -\u003e F -\u003e G\n```\n\nBecause [`configure()`](/concepts/configure.md) has no global side-effects, each\nsub-app is configured independently and mounted on its own URL. Sub-apps are\nlinked from a Plan using `url:///...` [waypoint](/concepts/waypoint.md) syntax.\n\n# Use cases\n\n* **Hub-and-spoke** navigation, where each Plan is an isolated gathering\n  journey.\n* **Repeatable sub-sections**, where a section can be isolated as a sub-app and\n  cleared down before the user re-enters it.\n\n# Citations\n\n[1] [Multiapp example README](https://github.com/dwp/govuk-casa/blob/main/examples/multiapp/README.md)\n[2] [Running multiple CASA sub-apps](https://github.com/dwp/govuk-casa/blob/main/docs/guides/using-sub-apps.md)\n"}, "index.md": {"id": "index.md", "type": "Home", "title": "Home — CASA Knowledge Bundle", "description": "Bundle root index and entry point.", "tags": [], "timestamp": "", "resource": "", "group": "bundle", "reserved": true, "body": "\n# CASA Knowledge Bundle\n\nAn [Open Knowledge Format](https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md)\nbundle describing **CASA** (`@dwp/govuk-casa`) — a Node.js / ExpressJS\nframework for building multi-page, GOV.UK Design System forms. This bundle\ncaptures the framework's core concepts, extension points, request flow,\nbuilt-in validators, example apps, and the external standards it builds on.\n\nStart here, then open individual concepts for detail. Cross-links use\nbundle-relative paths (beginning with `/`).\n\n# Core concepts\n\n* [CASA Framework](concepts/casa-framework.md) - Top-level overview of what CASA is and how its pieces fit together.\n* [configure()](concepts/configure.md) - The single entrypoint that wires up all routers, middleware, and the mount function.\n* [mount()](concepts/mount.md) - Seals configuration and mounts CASA onto an ExpressJS app.\n* [The Plan](concepts/plan.md) - Directed-graph blueprint of every journey a user can take.\n* [Waypoint](concepts/waypoint.md) - A visitable node in the Plan graph.\n* [Route](concepts/route.md) - A conditional edge connecting two waypoints.\n* [Journey Context](concepts/journey-context.md) - The per-user state (data + validation) of a journey.\n* [Page](concepts/page.md) - The concrete, interactive form that renders a waypoint.\n* [Field](concepts/field.md) - A single form input, its processors and validators.\n* [Validation](concepts/validation.md) - The validator system and the ten built-in rules.\n\n# Extension points\n\n* [Hooks](concepts/hooks.md) - Insert middleware at named points in the request lifecycle.\n* [Events](concepts/events.md) - React synchronously to Journey Context changes.\n* [Plugins](concepts/plugins.md) - Bundle config/bootstrap/template changes into reusable units.\n* [Edit mode](concepts/edit-mode.md) - Let users revisit and amend earlier answers.\n\n# Request flow & rendering\n\n* [Request lifecycle](concepts/request-lifecycle.md) - Ordered passage of a request through CASA's stages.\n* [Routers & middleware](concepts/routers-and-middleware.md) - The artifacts `configure()` returns and their mount order.\n* [Templating](concepts/templating.md) - Nunjucks layouts, blocks, macros, and error pages.\n* [Internationalisation](concepts/i18n.md) - Multi-language dictionaries via i18next.\n\n# Supporting material\n\n* [Concepts index](concepts/) - All architecture concepts.\n* [Examples](examples/) - The four bundled example applications.\n* [Playbooks](playbooks/) - Step-by-step task guides.\n* [References](references/) - External standards and libraries CASA depends on.\n"}, "log.md": {"id": "log.md", "type": "Log", "title": "Update Log", "description": "Chronological history of bundle updates.", "tags": [], "timestamp": "", "resource": "", "group": "bundle", "reserved": true, "body": "# Bundle Update Log\n\n## 2026-06-30\n* **Initialization**: Created the CASA OKF knowledge bundle targeting OKF v0.1, describing `@dwp/govuk-casa` at version 9.4.4.\n* **Creation**: Authored core architecture concepts under [/concepts](/concepts/), covering the [Plan](/concepts/plan.md), [Journey Context](/concepts/journey-context.md), [Pages](/concepts/page.md), [Fields](/concepts/field.md), and [Validation](/concepts/validation.md).\n* **Creation**: Documented extension points — [Hooks](/concepts/hooks.md), [Events](/concepts/events.md), and [Plugins](/concepts/plugins.md).\n* **Creation**: Captured the [request lifecycle](/concepts/request-lifecycle.md) and [routers & middleware](/concepts/routers-and-middleware.md) ordering.\n* **Creation**: Added the four bundled [examples](/examples/) and a [setup playbook](/playbooks/setting-up-a-casa-app.md).\n* **Creation**: Added [references](/references/) to the GOV.UK Design System, govuk-frontend, ExpressJS, i18next, and Nunjucks.\n"}, "playbooks/index.md": {"id": "playbooks/index.md", "type": "Index", "title": "Playbooks — Index", "description": "Directory listing for playbooks.", "tags": [], "timestamp": "", "resource": "", "group": "playbooks", "reserved": true, "body": "# Playbooks\n\nStep-by-step task guides for working with CASA.\n\n* [Setting up a CASA app](setting-up-a-casa-app.md) - Stand up a minimal CASA application from scratch.\n"}, "playbooks/setting-up-a-casa-app.md": {"id": "playbooks/setting-up-a-casa-app.md", "type": "Playbook", "title": "Setting up a CASA app", "description": "Step-by-step guide to standing up a minimal CASA application.", "tags": ["playbook", "getting-started", "setup"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "", "group": "playbooks", "reserved": false, "body": "\nThis playbook walks through the minimal steps to stand up a CASA service. For a\nworking version, see the [barebones example](/examples/barebones.md).\n\n# Steps\n\n1. **Define a Plan** in its own file, wrapped in a function so config can be\n   injected at runtime. See [The Plan](/concepts/plan.md).\n\n   ```javascript\n   // definitions/plan.js\n   import { Plan } from \"@dwp/govuk-casa\";\n   export default function () {\n     const plan = new Plan();\n     plan.addSequence(\"personal-details\", \"contact\", \"check-your-answers\");\n     return plan;\n   }\n   ```\n\n2. **Define pages** for each [waypoint](/concepts/waypoint.md), binding a view\n   and [fields](/concepts/field.md). See [Page](/concepts/page.md).\n\n3. **Configure** the app, passing views, session settings, the plan, and pages.\n   See [`configure()`](/concepts/configure.md).\n\n   ```javascript\n   import { configure, field } from \"@dwp/govuk-casa\";\n   import plan from \"./definitions/plan.js\";\n\n   const { mount } = configure({\n     views: [\"views\"],\n     session: { name: \"myapp\", secret: process.env.SECRET, ttl: 3600 },\n     i18n: { dirs: [\"locales\"], locales: [\"en\", \"cy\"] },\n     plan: plan(),\n     pages: [\n       {\n         waypoint: \"personal-details\",\n         view: \"pages/personal-details.njk\",\n         fields: [field(\"fullName\").validators([/* ... */])],\n       },\n     ],\n   });\n   ```\n\n4. **Mount** onto an ExpressJS app, optionally serving the first waypoint at the\n   root. See [`mount()`](/concepts/mount.md).\n\n   ```javascript\n   import express from \"express\";\n   const app = express();\n   app.use(\"/\", mount(express(), { serveFirstWaypoint: true }));\n   app.listen(3000);\n   ```\n\n5. **Add templates, translations, validators, and extensions** as needed —\n   [Templating](/concepts/templating.md), [i18n](/concepts/i18n.md),\n   [Validation](/concepts/validation.md), [Hooks](/concepts/hooks.md),\n   [Events](/concepts/events.md), and [Plugins](/concepts/plugins.md).\n\n# Citations\n\n[1] [Setting up a CASA application](https://github.com/dwp/govuk-casa/blob/main/docs/setup.md)\n"}, "references/express.md": {"id": "references/express.md", "type": "Reference", "title": "ExpressJS", "description": "The Node.js web framework CASA is built on; CASA ships as Express routers and middleware.", "tags": ["reference", "express", "nodejs", "middleware"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://expressjs.com/", "group": "references", "reserved": false, "body": "\n**ExpressJS** is the minimal Node.js web framework that CASA is built on. CASA\noffers \"a shallow learning curve\" precisely because it is composed of standard\nExpress [routers and middleware](/concepts/routers-and-middleware.md). You mount\na configured CASA app onto an Express app with [`mount()`](/concepts/mount.md),\nand you extend it with ordinary Express middleware through\n[Hooks](/concepts/hooks.md). CASA targets Express 4.\n\n# Citations\n\n[1] [ExpressJS](https://expressjs.com/)\n"}, "references/govuk-design-system.md": {"id": "references/govuk-design-system.md", "type": "Reference", "title": "GOV.UK Design System", "description": "The accessible, researched component and pattern library that CASA forms are built on.", "tags": ["reference", "govuk", "design-system", "accessibility"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://design-system.service.gov.uk/", "group": "references", "reserved": false, "body": "\nThe **GOV.UK Design System** provides styles, components, and patterns for\nbuilding UK government services that are accessible and consistent. CASA adopts\nit so services get well-researched, accessible markup out of the box. Its\ncomponent macros are available in [templates](/concepts/templating.md) under\n`govuk/components/*`, and CASA's own `casa/components/*` macros wrap them.\n\n# Citations\n\n[1] [GOV.UK Design System](https://design-system.service.gov.uk/)\n[2] [Components](https://design-system.service.gov.uk/components)\n"}, "references/govuk-frontend.md": {"id": "references/govuk-frontend.md", "type": "Reference", "title": "govuk-frontend", "description": "The npm package providing GOV.UK Design System styles, scripts, and Nunjucks macros.", "tags": ["reference", "govuk", "frontend", "nunjucks"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://www.npmjs.com/package/govuk-frontend", "group": "references", "reserved": false, "body": "\n**govuk-frontend** is the npm package that implements the\n[GOV.UK Design System](/references/govuk-design-system.md) — its CSS, JavaScript,\nassets, and Nunjucks macros. CASA bundles it: when resolving\n[templates](/concepts/templating.md), the `govuk-frontend` module directory is\nthe last in the search order, and its assets are served from the\n`/govuk/assets/` path by the static router. A `cspNonce` is provided for the\nframework's inline scripts.\n\n# Citations\n\n[1] [govuk-frontend on npm](https://www.npmjs.com/package/govuk-frontend)\n"}, "references/i18next.md": {"id": "references/i18next.md", "type": "Reference", "title": "i18next", "description": "The internationalisation library powering CASA's translation functions.", "tags": ["reference", "i18n", "translations"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://www.i18next.com/", "group": "references", "reserved": false, "body": "\n**i18next** is the library CASA uses under the hood for\n[internationalisation](/concepts/i18n.md). It powers the `req.t()` and template\n`t()` translation functions, language detection, namespaces, and string\ninterpolation. CASA loads dictionaries from JSON/YAML files organised by locale\nand namespace.\n\n# Citations\n\n[1] [i18next](https://www.i18next.com/)\n[2] [String interpolation](https://www.i18next.com/translation-function/interpolation)\n"}, "references/index.md": {"id": "references/index.md", "type": "Index", "title": "References — Index", "description": "Directory listing for references.", "tags": [], "timestamp": "", "resource": "", "group": "references", "reserved": true, "body": "# References\n\nExternal standards and libraries that CASA builds on, mirrored here as\nfirst-class concepts.\n\n* [GOV.UK Design System](govuk-design-system.md) - The component and pattern library CASA forms adopt.\n* [govuk-frontend](govuk-frontend.md) - The npm package implementing the Design System.\n* [ExpressJS](express.md) - The Node.js web framework CASA is built on.\n* [i18next](i18next.md) - The library powering CASA's translations.\n* [Nunjucks](nunjucks.md) - The templating engine CASA renders pages with.\n"}, "references/nunjucks.md": {"id": "references/nunjucks.md", "type": "Reference", "title": "Nunjucks", "description": "The templating engine CASA uses to render pages, with a specialised loader for plugins.", "tags": ["reference", "nunjucks", "templating"], "timestamp": "2026-06-30 00:00:00+00:00", "resource": "https://mozilla.github.io/nunjucks/", "group": "references", "reserved": false, "body": "\n**Nunjucks** is the Mozilla templating engine CASA uses to render\n[pages](/concepts/page.md) and layouts. CASA wraps Nunjucks' `FileSystemLoader`\nwith a specialised loader so [plugins](/concepts/plugins.md) can intercept and\nmodify template source (e.g. `modifyBlock()`). See\n[Templating](/concepts/templating.md) for layouts, blocks, macros, and the\ntemplate search order.\n\n# Citations\n\n[1] [Nunjucks](https://mozilla.github.io/nunjucks/)\n"}}, "order": ["concepts/casa-framework.md", "concepts/index.md", "concepts/configure.md", "concepts/edit-mode.md", "concepts/events.md", "concepts/field.md", "concepts/hooks.md", "concepts/i18n.md", "concepts/journey-context.md", "concepts/mount.md", "concepts/page.md", "concepts/plugins.md", "concepts/request-lifecycle.md", "concepts/route.md", "concepts/routers-and-middleware.md", "concepts/templating.md", "concepts/plan.md", "concepts/validation.md", "concepts/waypoint.md", "examples/barebones.md", "examples/dwp-frontend.md", "examples/index.md", "examples/fully-loaded.md", "examples/multiapp.md", "playbooks/index.md", "playbooks/setting-up-a-casa-app.md", "references/express.md", "references/govuk-design-system.md", "references/govuk-frontend.md", "references/i18next.md", "references/nunjucks.md", "references/index.md", "index.md", "log.md"], "graphNodes": ["concepts/casa-framework.md", "concepts/co
